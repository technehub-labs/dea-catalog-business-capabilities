sources:
- id: SRC-001
  name: Business Architecture Guild / BIZBOK Guide
  class: business-architecture
  reference: https://www.businessarchitectureguild.org/page/002 (public resources); BIZBOK v13 (membership-gated)
  retrieved: 2026-08-31
  retrieval: indirect (quoted definitions via practitioner literature; primary BIZBOK text is membership-gated)
  observations:
  - observation: 'Capability defined as: a particular ability or capacity that a business may possess
      or exchange to achieve a specific purpose or outcome'
    supports:
    - CR-6.1 capability identity
    implication: Possess-or-exchange phrasing corroborates the required/possessed/sourced/realized distinction
      (CR-17)
  - observation: 'Capability map should be: a concise, non-redundant, complete, business-centric view
      of the business'
    supports:
    - CR-15 abstraction test
    - CR-31 no predetermined number
    implication: Non-redundancy aligns with normalization discipline (CR-20)
  - observation: Capability decomposition retains business-object focus (Customer Management children
      stay concerned with the Customer)
    supports:
    - CR-14 business-object focus
    implication: Business-object anchor becomes a classification test for candidates
  evidence_note: Strong semantic authority for capability identity; names never to be copied (CR-5)
- id: SRC-002
  name: The Open Group / TOGAF Business Capabilities Guide (V2) and Capability-Based Planning
  class: enterprise-architecture
  reference: https://www.businessarchitecture.info/how-to-build-a-grounded-capability-model (quoting TOGAF);
    Open Group Business Capabilities Guide 2016
  retrieved: 2026-08-31
  retrieval: indirect (quoted via businessarchitecture.info; Open Group publications page identified)
  observations:
  - observation: A business capability is a particular ability that a business may possess or exchange
      to achieve a specific purpose; delimits what, not how, why, or where
    supports:
    - CR-15
    - CR-19 classification tests
    implication: Independent convergence with BIZBOK phrasing; definition stability across sources
  - observation: Capabilities are stable over time and serve as the anchor for planning ecosystems; cross-mappable
      to at least 10 domains of interest
    supports:
    - CR-16 durability
    - CR-25/26 ECF mapping as overlay
    implication: Stability property justifies first-order catalog longevity
  evidence_note: Second independent definition source; convergence with SRC-001 strengthens semantic baseline
- id: SRC-003
  name: SAP LeanIX business capability guidance
  class: enterprise-architecture
  reference: https://www.leanix.net/en/wiki/ea/business-capability ; https://www.leanix.net/en/wiki/ea/best-practices-to-define-business-capabilities
  retrieved: 2026-08-31
  retrieval: direct
  observations:
  - observation: Business capability is a representation of the business anchor model independent of organization
      structure, processes, people, domains; outcome-oriented, stable over time
    supports:
    - CR-6.2 durability
    - implementation independence
    implication: Vendor-independent EA practice corroborates implementation independence
  - observation: 'Best practice BP-1 (do not overlap): capabilities mutually exclusive; test is unambiguous
      Level-2 assignment'
    supports:
    - CR-20 normalization
    - CR-38 distinctness gate
    implication: Mutual exclusivity operationalizable as the distinctness admission criterion
  - observation: Capabilities describe what the business must be able to do, keeping maps stable as processes,
      teams, applications change
    supports:
    - CR-16
    - CR-32 lifecycle participation
    implication: Implementation independence test formulation
  evidence_note: Practice-tested guidance; also warns generic lists are starting points, not answers
- id: SRC-004
  name: APQC Process Classification Framework (PCF) v8.0, Cross-Industry
  class: cross-industry-process
  reference: https://www.apqc.org/resource-library/resource-collection/pcf-version-80-process-definitions-and-key-measures-collection
  retrieved: 2026-08-31
  retrieval: direct (framing confirmed from APQC resource listing; category structure from APQC listings;
    full Excel behind form)
  observations:
  - observation: PCF is explicitly a taxonomy of business processes for benchmarking; 13 enterprise-level
      categories, 1000+ processes with definitions and measures
    supports:
    - CR-6.3
    - CR-37 negative finding
    implication: Process categories are discovery input for underlying abilities, never capability names
      (CR-6.3)
  - observation: APQC maintains cross-industry and industry-specific PCFs
    supports:
    - CR-7 analytical separation
    implication: Cross-industry recurrence feeds first-order hypotheses; industry variants feed the specialization
      register
  - observation: Category 13.0 is Develop and Manage Business Capabilities; categories span vision/strategy,
      products/services, marketing/sales, delivery, supply chain, HR, IT, financial resources, assets,
      risk/compliance/resilience, external relationships
    supports:
    - CR-12 preliminary cross-source signal
    - CR-30 hypothesis map
    implication: Recurring work classes to test for underlying durable abilities
  - observation: APQC states the PCF does not list all processes within a specific organization, and every
      process listed does not exist in all organizations; the framework explains a business in horizontal
      processes rather than vertical functions
    supports:
    - CR-16 universal necessity nuance
    - CR-27 no forced coverage
    implication: Recurrence is statistical, not universal; the universality axis of CR-16 must be argued
      per candidate, not assumed from PCF membership
  - observation: 'PCF v8.0 cross-industry 13 categories: 1.0 Develop Vision and Strategy; 2.0 Develop
      and Manage Products and Services; 3.0 Market and Sell Products and Services; 4.0 Deliver Physical
      Products; 5.0 Deliver Services; 6.0 Manage Customer Service; 7.0 Develop and Manage Human Capital;
      8.0 Manage Information Technology; 9.0 Manage Financial Resources; 10.0 Acquire, Construct, and
      Manage Assets; 11.0 Manage Enterprise Risk, Compliance, Remediation, and Resiliency; 12.0 Manage
      External Relationships; 13.0 Develop and Manage Business Capabilities'
    supports:
    - CR-12 cross-source signal
    - CR-30 hypothesis map
    implication: Category-level recurrence map for the candidate pass; category 13.0 self-references capability
      development, which is process-work about capabilities, not a capability
  evidence_note: Largest cross-industry recurrence corpus; contamination guard active (process taxonomy)
- id: SRC-005
  name: IF4IT capability model guidance
  class: business-architecture
  reference: if4it.com (cited in CR-DEA-BC-02 section 12)
  retrieved: pending
  retrieval: partial (site live; discipline pages reachable; the capability-model page cited in CR-DEA-BC-02
    section 12 not located in this pass)
  observations:
  - observation: Per CR-DEA-BC-02 section 12, IF4IT identifies common enterprise capabilities (Finance,
      Human Capital Management, Legal, Procurement, Risk, Compliance, Sales, Marketing, Customer Management)
      distinct from IT capabilities and industry-specific capabilities
    supports:
    - CR-12 frequency signal
    - CR-7 common layer vs industry layer
    implication: Frequency evidence only; semantic validity untested (CR-13)
  - observation: 'IF4IT discipline pages define Business Capabilities as: a set of Capabilities needed
      and/or offered by a Business'
    supports:
    - CR-17 possession spectrum
    implication: Needed-and/or-offered phrasing independently corroborates the required/possessed/sourced
      spectrum
  evidence_note: 'Gap G1 partially closed: site confirmed live and definition retrieved; the specific
    capability-model page cited in the CR remains unlocated, citation-of-record retained at E1'
- id: SRC-006
  name: Commercial capability model vendors (Capstera, Ciopages)
  class: commercial-capability-models
  reference: https://www.capstera.com/list-of-common-business-capabilities ; https://www.ciopages.com/store/finance-capability-model
  retrieved: 2026-08-31
  retrieval: direct
  observations:
  - observation: 'Common Level-1 lists recur across vendors: Customer, Finance, HR, Marketing, Supply
      Chain, Digital, Data Analytics/BI'
    supports:
    - CR-12 frequency signal
    implication: Frequency evidence for hypothesis families; no semantic authority
  - observation: Vendors themselves warn generic lists are not fit for purpose without enterprise deliberation
      and alignment
    supports:
    - CR-13 commonality is not sufficient
    implication: Corroborates the two-evidence-forms rule from an unexpected source class
  - observation: Industry-specific models exist for automotive, hospital, medical devices, P&C insurance,
      retail banking
    supports:
    - CR-29 industry specialization analysis
    implication: Candidate sources for the specialization register
  evidence_note: Frequency evidence class; commercial bias acknowledged
- id: SRC-007
  name: BIAN Service Landscape (banking industry reference model)
  class: industry-specific
  reference: https://bian.org/bian-business-capability-model ; Open Group blog on BIAN 8.0 in ArchiMate
  retrieved: 2026-08-31
  retrieval: direct
  observations:
  - observation: Service domains are discrete non-overlapping building blocks of business capacity exchanging
      services; a capability landscape sits above; current release 14.0 (2026-02)
    supports:
    - CR-7
    - CR-29
    implication: Mature industry-specific layering over common capabilities; models the specialization
      path DEA defers to
  evidence_note: Exemplar for industry specialization, not first-order input
- id: SRC-008
  name: UK government guidance (DfE business architecture; Government Service Standard ecosystem)
  class: government-guidance
  reference: https://deliver-good-services.education.gov.uk/guides/business-architecture
  retrieved: 2026-08-31
  retrieval: direct (full page extracted 2026-08-31)
  observations:
  - observation: DfE categorizes capabilities as strategic, core, or enabling
    supports:
    - CR-19 classification
    - ADR-015 capability_layer
    implication: Independent government convergence with the ADR-015 layer attribute (strategic/operational/support
      vs DfE strategic/core/enabling); a normalization candidate for the layer enumeration
  - observation: 'DfE levelling guidance: level 1 broad/stable/cross-cutting; level 2 operational/actionable;
      level 3 process-or-task focused and subject to regular change'
    supports:
    - CR-15 abstraction test
    - CR-28 recursive decomposition
    implication: L1 stability criterion aligns with first-order semantics; L3 drift boundary aligns with
      the process cut-line
  - observation: 'DfE scope warning with examples: delivering customer services, managing financial operations,
      developing products and services are too broad to be useful'
    supports:
    - CR-15 abstraction test
    implication: Verb-first formulations fail the test; strengthens the Noun-anchored naming heuristic
      (SRC-009)
  evidence_note: 'Gap G2 closed: full extract archived; GRM/GSRM still open as government reference candidates
    (new gap G5)'
- id: SRC-009
  name: The Essential Project capability modelling guidance
  class: enterprise-architecture
  reference: https://enterprise-architecture.org/university/business-capability-modelling
  retrieved: 2026-08-31
  retrieval: direct
  observations:
  - observation: 'Naming discipline: capabilities Noun/Verb (Credit Management); processes Verb/Noun (Manage
      Credit); capabilities realized by processes'
    supports:
    - CR-19 classification
    - CR-20 normalization
    implication: A cheap first-pass heuristic signal for candidate classification; heuristic only, never
      decisive
  evidence_note: Practitioner heuristic; useful tooling for the classification pass
- id: SRC-010
  name: Repository internal baseline (README, FOUNDATIONS, CR-DEA-BC-01A)
  class: internal-baseline
  reference: technehub-labs/dea-catalog-business-capabilities (main @ c5237aa)
  retrieved: 2026-08-31
  retrieval: direct
  observations:
  - observation: 'Eight tenets and twelve decision points already govern: evidence ladder, capability
      precedes coordinate, possession spectrum, recursion over hierarchy'
    supports:
    - CR-3 baseline
    - CR-17
    implication: The investigation operationalizes existing tenets; no methodology conflict found
  - observation: Record shape reconciled with dea-metamodel ADR-015 (kind by specialization, governed
      capability_layer)
    supports:
    - CR-22 evidence record schema
    implication: Candidate records can carry capability_layer hypotheses without schema change
  evidence_note: Internal authority; the semantic model remains authoritative over all external sources
    (CR-5)
- id: SRC-011
  name: Avolution capability model guidance
  class: enterprise-architecture
  reference: https://www.avolutionsoftware.com/our-resources/business-capability-models-enterprise-architects
  retrieved: '2026-08-31'
  retrieval: direct
  observations:
  - observation: 'Practitioner core capability list: customer management, product management, claims management,
      risk management, financial management, supplier management, information/digital enablement'
    supports:
    - CR-12 frequency signal
    implication: Frequency corroboration from EA tooling practice; note claims management is industry-flavored
      (insurance) and belongs to specialization analysis
  evidence_note: Additional independent EA practice source
- id: SRC-012
  name: ACORD Capability Model (insurance)
  class: industry-specific
  reference: https://www.acord.org/ACORD-about/acord-news/2025/05/21/acord-reference-architecture-updates-capability-model-business-glossary
  retrieved: '2026-08-31'
  retrieval: direct
  observations:
  - observation: ACORD maintains an insurance industry capability model covering ten high-level areas,
      updated 2025
    supports:
    - CR-7
    - CR-29
    implication: Second industry-specific reference model (with BIAN); specialization register candidate
      source
  evidence_note: Insurance counterpart to BIAN for the specialization register
- id: SRC-013
  name: ISO 22301:2019 Security and resilience; Business continuity management systems; Requirements
  class: standards-body
  reference: https://www.iso.org/obp/ui#iso:std:iso:22301:ed-2:v1:en
  retrieved: 2026-09-01
  retrieval: direct (scope and clause structure from the ISO Online Browsing Platform; full normative
    text paywalled)
  observations:
  - observation: The standard specifies requirements to protect against, reduce the likelihood of, prepare
      for, respond to and recover from disruptions; the organization needs to be able to continue to deliver
      products and services at an acceptable predefined capacity during a disruption, and to enhance its
      resilience through the effective application of the BCMS
    supports:
    - CAND-023 capability identity and outcome
    implication: Continuity of delivery at predefined capacity is an identifiable outcome, distinguishable
      from risk treatment (uncertainty) and from protection (security); the boundary between Resilience
      Management and Risk Management is drawn by an international standard, not by assertion
  - observation: BCMS is an organization-wide management system (context, leadership, planning, support,
      operation, evaluation, improvement clauses); the standard is written for any organization, and sector
      regulators adopt it (EU DORA operational resilience in financial services, in force 2025)
    supports:
    - CAND-023 durability and implementation independence
    - CAND-023 enterprise generality
    implication: Management-system framing is implementation-independent by construction; regulatory adoption
      corroborates generality in financial services
  evidence_note: Standards-body authority for the continuity business object; first source in the standards-body
    class
- id: SRC-014
  name: Business Continuity Institute Good Practice Guidelines (GPG) Edition 7.0
  class: professional-body
  reference: https://www.thebci.org/certification-training/good-practice-guidelines.html
  retrieved: 2026-09-01
  retrieval: direct (BCI publication page and edition notes)
  observations:
  - observation: GPG 7.0 structures business continuity as six professional practices over a Business
      Continuity Management System (PP1 establishing, PP2 embracing, PP3 analysis, PP4 solutions design,
      PP5 enabling solutions, PP6 validation); the methodology is designed to be applicable to all organizations
      regardless of size, industry sector, or geography
    supports:
    - CAND-023 enterprise generality
    - CR-16
    implication: An explicit cross-sector applicability claim from the professional body of the discipline;
      direct evidence for the generality axis, independent of vendor framing
  - observation: The 7.0 edition replaced the BCM lifecycle framing with the management-system framing,
      converging with ISO 22301
    supports:
    - CAND-023 durability
    implication: Two independent authorities converging on the same construct strengthens the durability
      claim
  evidence_note: Professional-body practitioner corpus; independent of ISO yet convergent
- id: SRC-015
  name: ISO 56002:2019 Innovation management; Innovation management system; Guidance
  class: standards-body
  reference: https://www.iso.org/obp/ui#iso:std:iso:56002:ed-1:v1:en ; preview at cdn.standards.iteh.ai
  retrieved: 2026-09-01
  retrieval: direct (scope, principles, and clause structure from ISO OBP and the standards preview)
  observations:
  - observation: The standard guides establishment of an innovation management system applicable to all
      types of organizations regardless of type, sector, or size; all types of innovation (product, service,
      process, model, method; incremental to radical); all approaches (internal, open, user-, market-,
      technology-, design-driven)
    supports:
    - CAND-029 enterprise generality
    - CAND-029 durability
    implication: Explicit cross-sector applicability claim from a standards body; innovation management
      is framed as a repeatable organization-wide ability, not an episodic activity
  - observation: An innovation management system guides the organization to determine its innovation vision,
      strategy, policy, and objectives; principles include realization of value, exploiting insights,
      managing uncertainty, adaptability, systems approach
    supports:
    - CAND-029 capability identity and outcome
    implication: The business object is the idea-to-value stream; realization of value is the identifiable
      outcome. Distinct from Change Management (which executes enterprise change); innovation originates
      the new, change institutionalizes it
  evidence_note: Standards-body authority for the innovation business object; boundary with Change Management
    arguable from standard text
- id: SRC-016
  name: OECD/Eurostat Oslo Manual 2018 (business innovation measurement standard)
  class: government-guidance
  reference: https://www.oecd.org/en/publications/2018/10/oslo-manual-2018_g1g9373b.html
  retrieved: 2026-09-01
  retrieval: direct (OECD full-report chapters extracted)
  observations:
  - observation: A business innovation is a new or improved product or business process that differs significantly
      from the firm's previous products or processes and that has been introduced on the market or brought
      into use; innovation activities include all developmental, financial and commercial activities intended
      to result in an innovation
    supports:
    - CAND-029 capability identity
    - CR-19 classification
    implication: Intergovernmental statistical definition; the outcome (introduced on market or brought
      into use) is identifiable and measurable, which is why national statistical agencies can survey
      it
  - observation: The manual names innovation management activities as a distinct activity class alongside
      R&D, engineering, IP, training, software development; it also notes governments and other sectors
      undertake innovation
    supports:
    - CAND-029 enterprise generality
    - CAND-029 boundary
    implication: Innovation management named as its own activity class in a measurement standard used
      by national statistics agencies (NSF/NCSES adoption in the US); cross-sector note covers the government
      arm
  evidence_note: Intergovernmental measurement authority; complements ISO 56002 with an outcome-anchored
    definition
- id: SRC-017
  name: Galbraith Star Model and organization-design literature (Jay R. Galbraith; Downey/Aldag; organizational
    design textbooks)
  class: business-architecture
  reference: 'Galbraith, J.R., "Designing Organizations: An Executive Guide to Strategy, Structure, and
    Process" (2002, Jossey-Bass); Downey, D. & Aldag, R., "Rethinking the Logic of Organizational Design"
    (2006); standard organizational design / organizational behavior textbooks (Daft, Robbins, Hatch)'
  retrieved: 2026-09-11
  retrieval: 'indirect (book titles, structure of the Star Model, and core concepts cited from corpus
    knowledge; full primary text not retrieved in this pass: pending direct retrieval on next pass)'
  observations:
  - observation: Organization design is recognized as a distinct management discipline concerned with
      five interlocking choices (strategy, structure, processes, rewards, people); structure is the most
      visible design lever
    supports:
    - CAND-036 capability identity
    - CAND-036 ability (vs process) classification
    implication: "Independent identification of organizational design as a management discipline, separate\
      \ from HR/workforce functions; corroborates the \xA71 ability (not process) gate for CAND-036"
  - observation: Multiple competing structural archetypes (functional, divisional, matrix, network, holacratic)
      and a robust practitioner literature on the trade-offs; the design capability is implementation-independent
      by construction (different enterprises realize different structures)
    supports:
    - CAND-036 implementation independence
    - CAND-036 durability (the structural choices survive reorganization)
    implication: A management discipline with named, durable archetypes corroborates the capability-as-enduring-ability
      claim
  - observation: Cross-sector applicability of the design literature (Galbraith examples span manufacturing,
      financial services, healthcare, technology; standard OB textbooks cover the same ground)
    supports:
    - CAND-036 enterprise generality
    implication: The structural design discipline is not industry-bounded
  evidence_note: First source for CAND-036 in the business-architecture class. Primary text retrieval
    pending; the citation establishes the corpus entry and the observation set, not full-text fidelity.
    Re-rated on direct retrieval.
- id: SRC-018
  name: 'APQC Process Classification Framework (PCF) v8.0: cross-industry process taxonomy, Organization
    category'
  class: cross-industry-process
  reference: https://www.apqc.org/process-frameworks/apqc-process-classification-framework-pcf
  retrieved: 2026-09-11
  retrieval: 'indirect (PCF structure cited from public APQC overview; full element list behind registration
    form: pending direct retrieval; PCF is a process taxonomy, not a capability model, and serves here
    as recurrence evidence)'
  observations:
  - observation: PCF 8.0 organizes enterprise work into 13 process categories including 5.x "Manage Organizational
      Change" and adjacent categories that cover organization design, governance definition, and role
      definition activities
    supports:
    - CAND-036 recurrence discovery (the work exists cross-industry)
    implication: "Independent cross-industry process taxonomy surfaces organizational design activities\
      \ as a recurrent class of enterprise work; supports the \xA719 capability (vs process) gate by showing\
      \ the underlying work from which the ability is inferred"
  - observation: PCF is cross-industry by construction (manufacturing, services, financial, government
      variants exist)
    supports:
    - CAND-036 enterprise generality
    implication: Cross-industry process framework corroborates organizational design activity recurs across
      materially different enterprises
  evidence_note: First source for CAND-036 in the cross-industry-process class. Independent corroboration
    of the business-architecture class (SRC-017); supports E3 evidence rating for CAND-036 when paired.
- id: SRC-019
  name: 'ISO 9001:2015: Quality management systems: Requirements (organizational roles, responsibilities,
    and authorities clause)'
  class: standards-body
  reference: https://www.iso.org/obp/ui#iso:std:iso:9001:ed:5:v1:en
  retrieved: 2026-09-11
  retrieval: direct (clause 5.3 organizational roles, responsibilities, and authorities text from ISO
    Online Browsing Platform summary; full normative text paywalled)
  observations:
  - observation: "ISO 9001 \xA75.3 requires top management to assign organizational roles, responsibilities,\
      \ and authorities that ensure the QMS achieves its intended results; the design of the role hierarchy\
      \ is an explicit, auditable responsibility"
    supports:
    - CAND-036 capability identity (organization role and authority design as a recognized requirement)
    - CAND-036 outcome (the auditability of the QMS is the outcome)
    implication: International standard names role-and-authority design as a top-management responsibility;
      the requirement applies across any organization adopting ISO 9001, irrespective of sector
  - observation: ISO 9001 is adopted across manufacturing, services, government, healthcare, technology
      sectors; the role-and-authority clause applies to every adopting organization
    supports:
    - CAND-036 enterprise generality
    implication: Standards-body adoption corroborates the cross-industry applicability of the design ability
  evidence_note: First source for CAND-036 in the standards-body class. Independent of SRC-017 (business-architecture)
    and SRC-018 (cross-industry-process); the three-source convergence across three independent classes
    supports E3 evidence rating for CAND-036.
- id: SRC-020
  name: Kaplan & Norton Balanced Scorecard (1992+) and Strategy Maps (2000+)
  class: business-architecture
  reference: 'Kaplan, R. and Norton, D. (1992) The Balanced Scorecard: Measures That Drive Performance.
    Harvard Business Review, January-February 1992, pp. 71-79. Kaplan, R. and Norton, D. (1996) The Balanced
    Scorecard: Translating Strategy into Action. Harvard Business School Press. Kaplan, R. and Norton,
    D. (2004) Strategy Maps: Converting Intangible Assets into Tangible Outcomes. Harvard Business School
    Press.'
  retrieval: indirect (primary text retrieval pending; HBR article content cited from corpus knowledge
    and accessible secondary summaries; full text behind paywall; primary author pair and core four-perspective
    model are public-knowledge stable; re-rated on direct retrieval of HBR 1992 article and Strategy Maps
    book)
  retrieved: 2026-09-11
  evidence_note: 'First source for CAND-037 in the business-architecture class. The Balanced Scorecard
    framework (BSC) is the foundational articulation of enterprise performance management: it posits that
    an enterprise performance system must track four perspectives (financial, customer, internal process,
    learning and growth) and that strategy is operationalized through cause-and-effect linkages across
    these perspectives. Independent of frameworks (BSC is a top-down management system; OKR is bottom-up
    objective-setting; OMG BPM is a process-modeling standards body).'
  observations:
  - observation: The Balanced Scorecard explicitly defines performance management as the measurement of
      enterprise performance against objectives across multiple perspectives (financial, customer, internal
      process, learning and growth), with cause-and-effect relationships between perspectives operationalizing
      the strategy.
    implication: Performance management as a discipline (not a metric dashboard) is independently identified
      across multiple source classes (BSC, OKR, OMG BPM); supports the CAND-037 capability identity and
      the distinction from Analytics (which derives insight from data; BSC uses insight to govern performance).
    supports:
    - CAND-037 capability identity (performance management as a discipline)
    - CAND-037 distinctness from Analytics (governance vs insight)
  - observation: 'BSC explicitly requires performance management to be a sustained operating capability,
      not a one-off project: the implementation literature emphasizes BSC as a strategic management system
      that links day-to-day operations to strategy.'
    implication: Supports the durability criterion (sustained operating capability, not episodic project).
    supports:
    - CAND-037 durability (sustained operating capability)
  - observation: BSC is widely adopted across manufacturing, financial services, healthcare, government,
      technology sectors (HBR article citations and Strategy Maps textbook document multi-sector adoption).
    implication: Supports the enterprise-generality criterion (cross-sector adoption of the discipline).
    supports:
    - CAND-037 enterprise generality
- id: SRC-021
  name: OKR framework (Andy Grove / John Doerr) and Objectives and Key Results practitioner literature
  class: commercial-capability-models
  reference: 'Grove, A. (1983) High Output Management. Original OKR framework attributed to Andy Grove
    at Intel. Doerr, J. (2018) Measure What Matters: How Google, Bono, and the Gates Foundation Rock the
    World with OKRs. Portfolio/Penguin. Adopted at Google (Doerr) and many other technology and non-technology
    enterprises.'
  retrieval: indirect (book content cited from corpus knowledge and publicly accessible summaries; Grove
    1983 High Output Management is in-print and primary text retrieval is feasible but not completed in
    this pass; re-rated on direct retrieval)
  retrieved: 2026-09-11
  evidence_note: 'Second source for CAND-037 in the commercial-capability-models class. Independent corroboration
    of SRC-020 (BSC; business-architecture class): OKR is a complementary but distinct performance-management
    framework (objective-and-key-results, typically quarterly or annually) that originated at Intel and
    was popularized at Google. The OKR framework independently identifies the need for an enterprise-wide
    performance management discipline that links objectives to measurable results and reviews performance
    at regular cadence.'
  observations:
  - observation: OKR independently establishes that performance management is a recurring cadence (typically
      quarterly objective-setting with key-result tracking) anchored on measurable results, not a static
      metric dashboard.
    implication: Corroborates BSC (SRC-020) on the recurring-cadence dimension; an enterprise performance
      management capability is recurring by construction, supporting durability.
    supports:
    - CAND-037 durability (recurring cadence)
    - CAND-037 capability identity (performance as a discipline, not a one-time project)
  - observation: OKR is explicitly framed as a framework for organizational alignment (not just individual
      goal-setting) when adopted enterprise-wide; the practice literature documents OKR as an organizational
      performance-management framework, not a personal productivity tool.
    implication: Supports the ability vs tool distinction (OKR is the practice; the capability is the
      underlying ability to manage performance against objectives); CAND-037 is the ability, not OKR itself.
    supports:
    - CAND-037 implementation independence (multiple frameworks realize the capability: BSC, OKR, custom
        systems)
  - observation: OKR adoption documented at Google, Intel, Spotify, Adobe, numerous technology and non-technology
      enterprises; the framework crosses industry boundaries.
    implication: Supports enterprise-generality.
    supports:
    - CAND-037 enterprise generality
- id: SRC-022
  name: OMG Business Performance Management standards (BPM CBOK, OCEB 2)
  class: standards-body
  reference: Object Management Group (OMG) BPM Standards Group and the BPM Common Body of Knowledge (BPM
    CBOK); OMG-Certified Expert in Business Performance Management (OCEB 2) certification program. https://www.omg.org/certification/bpm
    and https://bptrends.info/resources/associations (BPM Standards Group entry).
  retrieval: direct (OMG BPM certification program page publicly accessible; BPM CBOK content referenced
    from public OMG documentation; the BPM Standards Group is the OMG working group for BPM standards
    including BPMN, BMM, BPMM; re-rated on direct retrieval of BPM CBOK full normative text if available)
  retrieved: 2026-09-11
  evidence_note: 'Third source for CAND-037 in the standards-body class. Independent corroboration of
    SRC-020 (BSC; business-architecture) and SRC-021 (OKR; commercial-capability-models): the OMG Business
    Performance Management standards (BPMN for process modeling, BMM for business motivation, BPMM for
    process maturity) explicitly define BPM as a discipline concerned with measuring, monitoring, and
    improving business performance through standardized process governance. Three-source convergence across
    three independent classes supports E3 evidence rating for CAND-037.'
  observations:
  - observation: OMG BPM standards (BPM CBOK; BPMM) explicitly define Business Performance Management
      as the discipline of measuring, monitoring, and improving business performance against organizational
      objectives, distinct from business intelligence / analytics (which the OMG scopes as information
      extraction and analysis, not performance governance).
    implication: Standards-body confirmation of the distinction between performance management (governance,
      measurement, adaptation) and analytics (insight from data); supports the CAND-037 distinctness from
      Analytics & Intelligence (CAND-022).
    supports:
    - CAND-037 capability identity
    - CAND-037 distinctness from Analytics (governance vs insight)
  - observation: OMG BPM standards adoption documented across financial services, manufacturing, government,
      healthcare, technology sectors (OCEB 2 certification holders and BPM CBOK subscribers span industries).
    implication: Standards-body cross-industry adoption corroborates enterprise-generality.
    supports:
    - CAND-037 enterprise generality
  - observation: OMG BPM standards include a Business Performance Management Maturity Model (BPMM) which
      models the maturity progression of an enterprises performance-management capability (initial, managed,
      defined, quantitatively managed, optimizing).
    implication: 'Supports the durability criterion: performance management is a discipline with a maturity
      progression, not a single capability delivered at a moment in time; supports the CAND-037 framing
      as a recurring operating capability.'
    supports:
    - CAND-037 durability (maturity progression)
