rules:
  primary: earliest legitimate initiation (FOUNDATIONS section 11)
  secondary: legitimate participation only
  no_forced_coverage: empty cells are valid results (CR section 27)
  conflicts: flagged, not smoothed (CR section 26)
applied_decisions:
  normalization:
    N-001: People cluster -> Workforce Management (CAND-015)
    N-002: Marketing is distinct, not a child (CAND-010)
    N-003: Analytics stays a provisional child of Information Management (later resolved by R-008 as distinct)
    N-004: Sourcing/Procurement and Supplier Management are distinct (CAND-025 vs CAND-007)
    N-005: Section 20 example resolved
    N-006R: Technology Management stands and is now mapped (CR-DEA-BC-08); technology is an estate, not an enabler of execution; stewardship of the estate belongs in Strategy & Direction, parallel to Asset Management and Facility Management
  review_decisions:
  - id: R-001
    candidate: CAND-008
    topic: Partner Management dual-home tension
    verdict: defensible-as-recorded
    rationale: "Partnering initiated at party-relationship \xD7 conceive; supply-side operation is legitimate participation;\
      \ dual-home tension expressed, not smoothed."
  - id: R-002
    candidate: CAND-010
    topic: Marketing placement
    verdict: defensible-as-recorded
    rationale: "N-002 settled Marketing distinct from Customer and Offering; primary party-relationship \xD7 conceive is honest."
  - id: R-003
    candidate: CAND-017
    topic: Information Management span
    verdict: defensible-secondaries-deliberately-empty
    rationale: The span of information across domains is a property of the business object, not of initiation; enumerating
      all domains would violate honest-not-exhaustive.
  - id: R-004
    candidate: CAND-019
    topic: Technology Management placement
    verdict: superseded-by-N-006R
    rationale: "N-006 carried a held-unmapped decision on the rationale that no ECF domain carries technology; that rationale was incorrect against the framework's canonical grounding (dea-metaframework/framework/domain-grounding.md sections 3.6 and 3.2). CR-DEA-BC-08 supersedes N-006 with N-006R: Technology Management is the technology-estate peer of Asset Management and Facility Management, primary coordinate strategy-direction \\xD7 build."
  - id: R-005
    candidate: CAND-028
    topic: Change Management cross-domain
    verdict: defensible-as-recorded
    rationale: "Earliest initiation governance-existence \xD7 improve; cross-domain applicability is an object property, not\
      \ a mapping defect."
  - id: R-006
    candidate: CAND-023
    topic: Resilience boundary vs Risk/Security
    verdict: deferral-lifted; admitted-at-PR-32
    rationale: ISO 22301 draws the boundary against Risk (uncertainty treatment) and Security (protection); BCI GPG 7.0 carries
      the all-sector applicability claim; evidence E4, generality 8/10 strong.
  - id: R-007
    candidate: CAND-029
    topic: Innovation boundary vs Change
    verdict: deferral-lifted; admitted-at-PR-32
    rationale: ISO 56002 draws the boundary against Change Management (innovation originates the new; change institutionalizes
      it); Oslo Manual 2018 names innovation management as a distinct activity class; evidence E4, generality 8/10 strong.
  - id: R-008
    candidate: CAND-018
    topic: Analytics boundary vs Information
    verdict: distinct-first-order; admitted-at-PR-32
    rationale: "Reading A: stewardship ends where derivation begins; operations-enablement \xD7 operate (primary), secondaries\
      \ empty per R-003 parity; record shape conforms; no layering violation. Boundary decision: docs/research/boundary-decision-cand-018\
      \ v0.1, PR #29."
  - id: N-007
    candidate: CAND-004
    topic: Stakeholder Relationship Mgmt grouping
    verdict: reclassified-as-grouping-parent; withdrawn-from-admission
    rationale: Aggregate parent; children admitted separately (CAND-005 Customer Mgmt, CAND-006 Citizen/Member, CAND-007 Supplier
      Mgmt, CAND-008 Partner Mgmt). Non-redundancy rule (BIZBOK SRC-001) applies.
  - id: N-008
    candidate: CAND-011
    topic: Value Delivery aggregate
    verdict: dissolved-as-first-order
    rationale: Aggregate candidate; boundary dissolved when children admitted (CAND-012 Operations is the first-order child
      that survives).
