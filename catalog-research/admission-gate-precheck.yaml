    \ framework); outcome identifiable (enterprise performance against objectives; auditable per ISO-style\
    \ governance extensions); boundary defensible (Performance business object distinct from Insight /\
    \ Outcome / Decision / Plan / Enterprise Posture / Money Flows / Agent Lifecycle / Organization Structure\
    \ / Technology Estate / Technology Service); distinctness (8-peer sweep passes by business-object\
    \ partition); specialization not required (foundation per METHODOLOGY \xA75 anti-invention; every\
