consequences:
  positive:
    - "H8 conformance for the third of the three BC-09 advisory-set bare-noun entries; the catalog is now clean of H8 failures under the noun-as-ability hard gate."
    - "The noun-of-product Insight is consistent across three source classes; the rename aligns the name to the documented object."
    - "Aliases preserve all colloquial forms (Analytics and Intelligence, Business Intelligence, Data and Analytics) for downstream discoverability."
  negative:
    - "Semver-incompatible name change; downstream callers referencing the old id must update. Aliases preserve the colloquial name; the migration-id-map entry records the lineage."
    - "Five sibling cross-references in information-management, technology-enablement, technology-management, strategic-planning, and the offering-management view require update to the new id. (Done under CR-DEA-BC-22.)"
  neutral:
