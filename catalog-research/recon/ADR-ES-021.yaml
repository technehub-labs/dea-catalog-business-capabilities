---
adr_id: ADR-ES-021
title: "Analytics and Intelligence: rename to Insight Management under TAXONOMY rule 7"
status: ratified (2026-09-30; user ratified V-A Insight Management on 2026-09-30; CR-DEA-BC-22 applies the rename on 2026-09-30)
date: "2026-09-30"
cr: "CR-DEA-BC-21 (companion to CR-DEA-BC-20)"
inventory: "INV-AI-v0.1 (catalog-research/recon/INV-AI-v0.1.yaml)"
candidate: "CAND-018"

context: |
  CR-DEA-BC-20 deferred the noun-as-ability naming question on
  Analytics and Intelligence (CAND-018) to dedicated ADR recon per
  user DP-E: the user observed that "Analytics" and "Intelligence"
  are two disciplines with common and unique ability characteristics,
  and that the catalog needed a dedicated ADR to research the rename
  direction.

problem_statement: |
  The current canonical name "Analytics and Intelligence" reads as a
  noun-of-discourse (H8 hard fail at CR-DEA-BC-20). The entry is in the
  BC-09 advisory set; the user wanted a deliberate, source-grounded
  decision rather than an opportunistic rename.

options_considered:
  - vector: V-A
    name: Insight Management
    proposed_id: capabilities:capability-insight-management-ms4n9d
    proposed_name: Insight Management
    proposed_business_object: Insight (unchanged)
    proposed_version: 2.0.0
    aliases_retained:
      - Analytics and Intelligence
      - Data and Analytics
      - Insight
      - Intelligence
      - Business Intelligence
    recommendation: CHOSEN (PRIMARY)
    rationale: |
      Three source classes (BABOK v3, BIZBOK v14, DMBOK 2nd ed. plus
      OMG DMN and APQC PCF 7.4) converge on "insight" as the
      noun-of-product. The Management gerund matches the recognized
      noun-as-ability pattern. All five sibling distinctness neighbors
      (information-management, knowledge-management, strategic-planning,
      enterprise-performance-management, technology-enablement) are
      partition-distinct. ECF placement at enablement-operations x
      operate is preserved. The user-vocabulary test passes.
  - vector: V-B
    name: Intelligence Management
    recommendation: DEPRECATED
    rationale: |
      "Intelligence" as head noun collapses to "Analytics" under DMBOK
      2nd ed. and Forrester Wave; one source class only; distinctness
      from the historical "BI" term is muddy.
  - vector: V-C
    name: Decision Intelligence Management
    recommendation: DEPRECATED
    rationale: |
      Gartner Decision Intelligence is a vendor-class market category,
      not an enterprise-generic ability. APQC PCF 7.4 does not use
      the DI arity.
  - vector: V-D
    name: Analytics and Intelligence reviewed-retained
    recommendation: DEPRECATED
    rationale: |
      H8 hard fail; the only legal override is a verdict review-retained
      decision. CR-DEA-BC-20 deferred to BC-21 ADR for resolution;
      V-A supersedes with a clean rename that passes H8.

decision: V-A
renames:
  from:
    id: dea:capability-analytics-and-intelligence
    name: Analytics and Intelligence
    version: 1.0.0
    business_object: Insight
    aliases: []
  to:
    id: capabilities:capability-insight-management-ms4n9d
    name: Insight Management
    version: 2.0.0
    business_object: Insight
    aliases:
      - Analytics and Intelligence
      - Data and Analytics
      - Insight
      - Intelligence
      - Business Intelligence

cross_references:
  - BC-09 advisory set
  - CR-DEA-BC-20 (section 6; the noun-as-ability rule 7 + H8 + advisory set; DP-E deferred item)
  - CR-DEA-BC-21 (the recon CR; this ADR)
  - CR-DEA-BC-22 (follow-on rename CR; applies the rename)
  - ADR-ES-021 itself (this record)
  - N-022 (catalog-research/normalization.yaml verdict rename-applied on user ratification)
  - INV-AI-v0.1 (catalog-research/recon/INV-AI-v0.1.yaml)
  - cand_018_vectors (catalog-research/candidates.yaml extension)
  - SRC-023/024/025 (catalog-research/evidence-register.yaml new sources)
  - G11 (catalog-research/evidence-register.yaml new gap)

