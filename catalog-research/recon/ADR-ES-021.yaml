  - "CR-DEA-BC-22: applies the rename on 2026-09-30; entities/v1-alpha/dea:capability-analytics-and-intelligence -> dea:capability-insight-management; aliases appended; version 1.0.0 -> 2.0.0; cross-references in information-management and technology-enablement updated; CATALOG.yaml + README + CHANGELOG + capability map updated; reconciliation/migration-id-map.yaml extended (3 new id_map entries; 1 new known_residual for the pre-rename slug)."
