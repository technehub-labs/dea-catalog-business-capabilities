findings:
  p1_organizational_design:
    status_at_review: 'P1 (reviewer): strong candidate for canonical capability'
    status_at_audit: CLOSED 2026-09-11 under CR-DEA-BC-18 (evidence package) + CR-DEA-BC-14 (admission). CAND-036 promoted E3 -> E4. Catalog 27 -> 28 first-order capabilities. dea:capability-organizational-design admitted at agency-organization/design primary + conceive/build secondaries.
    canonical_entry: capabilities:capability-organizational-design-vanefq
    action: no action; closed.
  p1_enterprise_performance_management:
    status_at_review: 'P1 (reviewer): strong candidate for canonical capability; gap #2 in BC-SR-A001 section 5'
    status_at_audit: CLOSED 2026-10-12 under CR-DEA-BC-19 (evidence package) + CR-DEA-BC-23 (admission). CAND-037 promoted E1 -> E3 then admitted. Catalog 28 -> 29 first-order capabilities. dea:capability-enterprise-performance-management admitted at strategy-direction/operate primary + strategy-direction/improve + finance-accounting/operate secondaries. BC-SR-A001 section 16 direction loop closed.
    canonical_entry: capabilities:capability-enterprise-performance-management-5fxren
    action: no action; closed. BC-SR-A001 section 16 (closed-loop capability structure) satisfied.
  p1_p2_relationship_management:
    status_at_review: 'P1-P2 (reviewer): investigate generic parent vs role-specific capabilities; gap #3 in BC-SR-A001 section 6'
    status_at_audit: OPEN at E2 (TER-RELMGMT-001). Track C investigation. CAND-004 (Stakeholder Relationship Management) was reclassified to grouping_parent at N-018 (CR-DEA-BC-20). CAND-005 (Customer Management) admitted. CAND-006 (Citizen / Member Relationship) blocked on G5.
    current_state:
      parent: CAND-004 reclassified to grouping_parent (N-018)
      children:
      - CAND-005 Customer Management (admitted; canonical 1.0.0)
      - CAND-006 Citizen / Member Relationship (E2; deferred pending G5)
      - CAND-007
      - CAND-008
      ter_status: 'TER-RELMGMT-001 evidence-pending at E2 (sources_consulted: BIZBOK Party/Relationship, CRM industry literature, SRM industry literature)'
      open_evidence_questions:
      - Is Relationship a distinct durable business object, or an abstraction over role-specific caps?
      - If admitted, do Customer/Supplier/Partner become specializations (opt 1), abstract grouping only (opt 2), or no parent (opt 3)?
      - Does it survive the enterprise-generality test?
    recommendation: downgrade from P1-P2 to P2 (research backlog). The P1 push was for the 28-canonical era; the 29-canonical era is the closed-cell era. The Relationship Management question is research-led, not admission-led. The next step is the BC-30 (G5 closure) work; if CAND-006 promotes to canonical, the Relationship Management question may resolve as a 'no separate parent' verdict (opt 3).
    action: 'N-027 decision: Relationship Management reclassified from P1-P2 to P2. Track C investigation remains open but not blocking the next 5-10 admissions. CAND-006 unification (BC-27 follow-on) is the next step.'
  p2_knowledge_management:
    status_at_review: 'P2 (reviewer): evidence investigation required; gap #4 in BC-SR-A001 section 7'
    status_at_audit: DEFERRED. No candidate in candidates.yaml. No TER in evidence-register.yaml. The Knowledge Management question is research-led; would require new TER-KNOWLEDGEMGMT-001 + new candidate CAND-knowledge-mgmt.
    recommendation: keep at P2. No follow-on work scheduled.
    action: no action.
  p2_service_management:
    status_at_review: 'P2 (reviewer): investigate whether Operations already absorbs it; section 17 (rest)'
    status_at_audit: DEFERRED. No candidate. The Service Management question is boundary-led against Operations Management (canonical 2.0.0; primary cell enablement-operations/operate; admitted at BC-09). The post-BC-20 boundary between Service Management and Operations Management is implicit; an explicit decision would require a new TER.
    recommendation: keep at P2. If a future specialization view (e.g. view-managed-services) is needed, the Service Management question resolves as 'specialization of Operations Management' (no separate canonical).
    action: no action.
  p2_quality_management:
    status_at_review: 'P2 (reviewer): investigate whether Operations/Assurance already absorbs it; section 17 (rest)'
    status_at_audit: DEFERRED. No candidate. The Quality Management question is boundary-led against Operations Management and Assurance-related capabilities (Security Management, Risk Management, Continuity Management).
    recommendation: keep at P2. The H8 noun-as-ability rule (BC-20) treats 'Quality' as a known outcome-state marker; a Quality Management canonical would need a review-retained verdict (N-024 mechanism extended at BC-25, but Quality is intentionally NOT in the GOVERNANCE_OBJECTS set).
    action: no action.
  p3_stakeholder_management:
    status_at_review: 'P3 (reviewer): likely specialization of Relationship Management'
    status_at_audit: DEFERRED. Stakeholder Management is a likely specialization of Relationship Management (or, post-N-018, an alias for the CAND-004 grouping_parent). If CAND-004 reclassifies to a future Relationship Management canonical, Stakeholder Management becomes a child of that.
    recommendation: keep at P3. No candidate. No follow-on work scheduled.
    action: no action.
  p3_enterprise_architecture_management:
    status_at_review: 'P3 (reviewer): probably specialization/model construct rather than first-order capability'
    status_at_audit: DEFERRED. Enterprise Architecture Management is a model construct (dea-metaframework v2.5.0 is the metamodel; the catalog is one of its consumers; EAM is the management of the metamodel, not a business capability). EAM is a specialization/model construct, not a first-order capability.
    recommendation: retire from the P3 list. EAM is not a candidate for first-order admission. The cross-repo governance for the dea-metaframework is handled by the dea-architecture-framework repo, not the dea-catalog-business-capabilities repo.
    action: 'N-028 decision: Enterprise Architecture Management retired from the P3 list. Verdict: specialization/model construct; not a first-order capability candidate.'
