  rationale: EAM is a model construct, not a first-order business capability. The dea-metaframework v2.5.0 is the metamodel; the catalog is a consumer; EAM is the management of the metamodel. The dea-architecture-framework repo is the cross-repo governance home, not the dea-catalog-business-capabilities repo.
