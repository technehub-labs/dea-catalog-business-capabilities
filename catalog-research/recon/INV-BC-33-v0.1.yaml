    No entry is un-documented post-BC-13; EPM's ecf_rationale was added at BC-29.
  F2: All 29 entries align with one of the four heuristics under the rule. No misplacements detected.
  F3: 'Track C dependency notes on Supplier Management and Partner Management (carried over from the v1-alpha baseline)
    are voided by N-030 (opt 2: no parent admitted). The notes are updated to reflect closure of the dependency;
