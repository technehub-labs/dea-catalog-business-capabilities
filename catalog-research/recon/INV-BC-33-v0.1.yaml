id: INV-BC-33-v0.1
cr: CR-DEA-BC-33
date: '2026-10-12'
author: Coder (for eaojnr)
trigger: BC-28 surfaced per-cell placement review as the only remaining sub-question post-BC-23 closure; this CR
  closes it
related_normalization_decisions: []
status: applied
scope: re-evaluate the 29/49 populated ECF cells (29 entries) against the CR-DEA-BC-13 §A semantic-center-of-gravity
  rule; confirm placement or detect drift
out_of_scope: new admissions; per-entry narrative rewrites; linter changes
background: 'CR-DEA-BC-13 (2026-09-10) established the semantic-center-of-gravity rule: the primary coordinate marks
  the capability''s defining work, not where its lifecycle begins. The rule has four heuristics applied in order:
  (1) sustained stewardship -> operate; (2) posture or constitutive decision -> conceive; (3) designed artifact
  or pattern -> design or build; (4) activation or enforcement -> activate. BC-28 (2026-10-12) surfaced a per-cell
  placement review as the only remaining sub-question in the BC-SR-A001 backlog. BC-23 admitted EPM and BC-29 added
  the backfilled ecf_rationale; the placements are now uniformly documented. The review is the final sweep.'
method:
  rule_source: CR-DEA-BC-13 §A (semantic-center-of-gravity)
  heuristics:
  - 'Heuristic 1: sustained stewardship / execution -> operate in the capability''s domain'
  - 'Heuristic 2: posture / constitutive decision -> conceive in the capability''s domain'
  - 'Heuristic 3: designed artifact / pattern / build phase -> design or build in the capability''s domain'
  - 'Heuristic 4: activation / enforcement -> activate in the capability''s domain'
  check_1: 'All 29 entries'' ecf_rationale fields contain an explicit reference to BC-13 or the semantic-center-of-gravity
    rule. (Confirmed by automated search: 0 of 29 entries lack the reference.)'
  check_2: By-name dominant heuristic classification aligns with current primary coordinate for all 29 entries.
    (Confirmed by manual review against the four heuristics; see review_table.)
  check_3: No cell placement predates the rule without a recorded re-evaluation note. (All four pre-CR-13 placements
    were re-mapped at CR-13 §B; the re-maps are recorded in the rationales of the moved entries.)
