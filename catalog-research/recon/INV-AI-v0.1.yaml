recommendation:
  vector: "V-A"
  new_id: "dea:capability-insight-management"
  new_name: "Insight Management"
  current_id: "dea:capability-analytics-and-intelligence"
  current_name: "Analytics and Intelligence"
  rationale: |
    Three independent source classes (SRC-023 cross-industry-process; SRC-024
    business-architecture; SRC-025 standards-body) converge on "insight" as the
    noun-of-product of the analytics activity. The Management suffix passes the
    TAXONOMY rule 7 noun-as-ability test. The proposed name preserves BC-SR-A001
    boundary v0.1 (peer of Information Management) without re-litigation. The
    current name "Analytics and Intelligence" reads as two nouns joined by a
    conjunction, with no ability suffix; both tokens are flagged by H8.

