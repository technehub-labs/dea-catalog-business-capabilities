conflict_resolutions:
- candidate: CAND-008
  id: R-001
  decision: mapping defensible as recorded
  rationale: The partnering ability is first initiated when the enterprise conceives its demand-side relationships (customer-demand
    x conceive); supply-side operation is legitimate participation (secondary). The dual-home tension is inherent to partnering
    and is expressed, not smoothed.
- candidate: CAND-010
  id: R-002
  decision: mapping defensible as recorded
  rationale: N-002 settled the normalization question (Marketing stands distinct from Customer Management and Offering Management);
    with the blocker removed, primary customer-demand x conceive (marketing conceives demand) with secondary operate is honest.
- candidate: CAND-017
  id: R-003
  decision: mapping defensible as recorded; secondaries deliberately empty
  rationale: The span of information across domains is a property of the business object, not of the capability initiation.
    Enumerating every domain as secondary would violate the honest-not-exhaustive rule; placement at operations-delivery x
    operate distorts neither model.
- candidate: CAND-019
  id: R-004
  decision: 'N-006 resolved: business capability with business object Technology; ECF legitimately absent'
  rationale: 'Technology Management is enterprise-general (every enterprise manages technology investment, lifecycle and sourcing
    regardless of industry). The apparent cross-cuttingness was a mapping symptom: no ECF domain carries technology (an L5
    layer concern). The section 38 legitimately-absent clause and the FOUNDATIONS section 1 general rule (catalogs contribute
    where semantics legitimately intersect) cover this case exactly. Admission not blocked; entry carries held_unmapped with
    note.'
- candidate: CAND-028
  id: R-005
  decision: mapping defensible as recorded
  rationale: 'Earliest initiation is governance-existence x improve: the ability is first exercised when the enterprise deliberately
    improves itself. Cross-domain applicability is a property of the change object (anything may change), not a mapping defect;
    secondaries stay empty per honest-not-exhaustive.'
out_of_scope_flags:
