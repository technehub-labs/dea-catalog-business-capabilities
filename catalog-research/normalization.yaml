  confidence: low
- id: N-010
  question: 'CR-DEA-BC-09 naming conformance: Compliance Management (CAND-021) against TAXONOMY section 1 rules
    2 and 4'
  candidates:
  - CAND-021
  evidence:
  - SRC-002
  - SRC-004
  - SRC-005
  analysis: 'Compliance is a state of conformity to regulation: outcome-adjacent (rule 4) and not the business
    object (rule 2). The object is Regulation; the ability is to know the enterprise regulatory obligations and
    to conform to them demonstrably. Regulation Management names the object in plain vocabulary (regulatory
    affairs usage); the misreading risk (a regulator managing the regulations it writes) is resolved by the
    definition and boundary, which scope the ability to the enterprise conformance posture.'
  outcome: Renamed Compliance Management -> Regulation Management
  action: 'Entry renamed; id dea:capability-compliance-management -> capabilities:capability-regulation-management-gya4d8;
    former name recorded in aliases; version 1.0.0 -> 2.0.0 (identity change, VERSIONING section 1.2)'
  confidence: high
