  verdict: admitted
  decision_basis: 'Cell strategy-direction x operate is the only cell on the strategy-direction edge of the 7x7 ECF matrix without a canonical entry. CAND-037 closes the direction loop (BC-SR-A001 §16): Strategy Formulation -> Strategic Planning -> Performance Management -> Insight Management -> Adaptation. EPM is the governance and measurement side; Insight Management is the insight side. They are complementary, not overlapping. Distinct from Financial Resource Management (money side), Strategy Formulation (posture), Strategic Planning (plan). ECF placement per CR-DEA-BC-13 §D.2 + CR-DEA-BC-19: strategy-direction/operate primary; strategy-direction/improve + finance-accounting/operate secondaries. H8 noun-as-ability: Management gerund passes cleanly. No review-retained exemption needed. Version 1.0.0 (admission is the first release). metamodel_pin 1.0.0 (org-wide pin).'
  confidence: high



