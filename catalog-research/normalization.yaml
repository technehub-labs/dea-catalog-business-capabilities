  outcome: Renamed to Insight Management (V-A ratified; CR-DEA-BC-22 applied)
  verdict: rename-applied
  affected_entry: dea:capability-insight-management
  prior_affected_entry: dea:capability-analytics-and-intelligence
  recommendation: V-A Insight Management (dea:capability-insight-management)
  action: Rename applied under CR-DEA-BC-22 on 2026-09-30; user ratification of V-A
