- id: N-029
  question: 'CAND-006 (Citizen / Member Relationship) vs CAND-005 (Customer Management)
    unification: should CAND-006 be admitted as a distinct first-order capability, or
    absorbed as a sector-specialization of CAND-005? Gap G5 (government reference models)
    is now closed per SRC-026 (TOGAF GRM), SRC-027 (GoC BTEP GSRM), and SRC-028 (US FEA
    CRM v2.3).'
  question_kind: capability-admission-unification
  cr: CR-DEA-BC-30
  affected_entry: capabilities:capability-customer-management-f3n8wb
  candidates:
  - CAND-006
  - CAND-005
  sources:
  - SRC-026 (TOGAF GRM)
  - SRC-027 (GoC BTEP GSRM)
  - SRC-028 (US FEA CRM v2.3)
  - SRC-001 (BIZBOK)
  - SRC-002 (TOGAF)
  - SRC-003 (SAP LeanIX)
  - SRC-005 (IF4IT)
  - SRC-008 (original CAND-006 source)
  evidence:
  - evidence_strength: E4
    basis: 'Three government reference models (TOGAF GRM, GoC BTEP GSRM, US FEA CRM v2.3)
      all converge on customer-service vocabulary for the citizen interface. TOGAF GRM
      sector "General Government (Customer Service, Customer Operations) and Local Services"
      uses CUSTOMER vocabulary. GoC BTEP GSRM types services by pattern (17 service types),
      not by party type; no distinct citizen-relationship service type. US FEA CRM v2.3 BRM
      names "Services for Citizens" as a business area, but the SRM domain is "Customer
      Services Domain" (section 5.1) -- the machinery uses CUSTOMER vocabulary even where
      the beneficiary is the citizen. CAND-006 evidence rises from E2 (CAND-004 + SRC-008)
      to E4 (3 new government reference models + 5 baseline sources).'
  verdict: merged-into-CAND-005
  decision_basis: 'Citizen is the party-type specialization of the Customer object in the
    government sector; it is not a distinct first-order capability. The three government
    reference models are unanimous: no separate citizen-relationship capability. The
    business_object specialization (Customer vs Citizen vs Member) is captured downstream
    as a customer-segment specialization under CAND-005 (Customer Management); the
    relationship-management mechanism is unchanged. CAND-006 is merged into CAND-005;
    no separate canonical entry is admitted. The 29-count is unchanged.'
  confidence: high

