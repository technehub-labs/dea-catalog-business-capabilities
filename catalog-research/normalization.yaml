- id: N-012
  question: 'CR-DEA-BC-09 naming conformance: Innovation Management (CAND-029) against TAXONOMY section 1 rule
    2'
  candidates:
  - CAND-029
  evidence:
  - SRC-002
  analysis: 'The recorded object is Idea; innovation names the act of innovating (a process reading, rule 1)
    or the produced novelty (an outcome reading, rule 4). Idea Management names the object in plain vocabulary.
    Residual tension: the ability covers development and realization, which the name Idea Management may
    undershoot; resolved by the definition (originate, develop, and realize ideas) and by the outcome
    (innovations introduced, not merely ideated). Changing business_object Idea -> Innovation was considered
    and deferred: a business_object change is an evidence-bearing semantic change, out of scope for a naming
    conformance pass.'
  outcome: Renamed Innovation Management -> Idea Management
  action: 'Entry renamed; id dea:capability-innovation-management -> capabilities:capability-idea-management-86dckf; former
    name recorded in aliases; version 1.0.0 -> 2.0.0; business_object question parked (evidence-bearing
