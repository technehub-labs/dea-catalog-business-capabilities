- id: N-023
  question: CR-DEA-BC-23 admission of Enterprise Performance Management (CAND-037) as 29th first-order canonical capability
  question_kind: admission
  cr: CR-DEA-BC-23
  affected_entry: capabilities:capability-enterprise-performance-management-5fxren
  prior_affected_entry: capabilities:candidate-epm-5fxren
  candidates:
  - CAND-037
  sources:
  - SRC-020 (Kaplan & Norton Balanced Scorecard 1992+; business-architecture class)
  - SRC-021 (OKR framework per Andy Grove / John Doerr; commercial-capability-models class)
  - SRC-022 (OMG Business Performance Management standards; standards-body class)
  - SRC-001
