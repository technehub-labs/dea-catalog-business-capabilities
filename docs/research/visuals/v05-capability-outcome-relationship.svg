<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300"><rect width="1080" height="300" fill="#ffffff"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52606d"/></marker></defs><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#1f2933" text-anchor="start" font-weight="600">Capability / Outcome Relationship</text><text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="start">an outcome is a result; a capability is the ability to produce it (METHODOLOGY.md section 3)</text><rect x="60" y="110" width="340" height="90" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/><text x="230" y="148" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="600">Customer Management</text><text x="230" y="172" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle">capability (CAND-005)</text><rect x="680" y="110" width="340" height="90" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/><text x="850" y="148" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">Customer Satisfaction</text><text x="850" y="172" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle">outcome (distinct construct)</text><line x1="404" y1="155" x2="676" y2="155" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/><text x="540" y="140" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">produces / enables</text><text x="540" y="240" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle">the arrow is realization, not identity: the metamodel relates the two without equating them</text></svg>