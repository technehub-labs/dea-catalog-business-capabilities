id: dea:capability-asset-management
type: BusinessCapability
name: Asset Management
definition: The ability to steward the enterprise's non-financial, non-workforce assets
  across their lifecycle.
version: 1.0.0
lifecycle_status: active
capability_layer: support
outcome: Assets are known, maintained, utilized, and retired deliberately.
business_object: Asset
ecf:
  primary:
    domain: supply-resources
    stage: build
  secondary:
  - domain: supply-resources
    stage: operate
  - domain: supply-resources
    stage: retire
related_capabilities:
- dea:capability-facility-management
evidence:
  sources:
  - SRC-002
  - SRC-004
  rationale: Enterprise-generality demonstrated at E3; evidence trail in docs/research
    (evidence-register, enterprise-generality-matrix, distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8,
      #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: E3; parent of Facility Management per the sweep (facilities are the
  asset class large enough to warrant its own first-order capability).
ecf_rationale: Primary build in supply-resources; operated and retired across the
  asset lifecycle.
boundary: Stewards assets; does not manage money (Financial Management), technology
  as an estate (Technology Management), or facilities specifically (Facility Management).
non_examples:
- An asset register (an artifact)
- A CMMS (a system)
specialization_boundary: Asset classes (fleet, plant, spectrum rights) are specialization;
  the ability to steward assets is not.
ecfConformance:
  framework: EnterpriseConceptFramework
  contractVersion: 1.0.0
  profile: dea:ecf@1.0.0
  status: conformant-with-extension
  affiliation: mapped
  canonicalReferences:
  - kind: coordinate
    domain: SupplyAndResources
    stage: Build
    identifier: ecf:supplyResources.build
    schema: https://github.com/technehub-labs/dea-metaframework/schemas/ecf-coordinate.schema.json
    role: primary
  - kind: coordinate
    domain: SupplyAndResources
    stage: Operate
    identifier: ecf:supplyResources.operate
    schema: https://github.com/technehub-labs/dea-metaframework/schemas/ecf-coordinate.schema.json
    role: secondary
  - kind: coordinate
    domain: SupplyAndResources
    stage: Retire
    identifier: ecf:supplyResources.retire
    schema: https://github.com/technehub-labs/dea-metaframework/schemas/ecf-coordinate.schema.json
    role: secondary
  extensions:
  - name: kebab-case-domain-vocabulary
    kind: display-vocabulary
    description: Catalog-side kebab-case labels for the seven ECF Domains and seven
      ECF Stages (see mapping). Display-only; resolves to canonical PascalCase enums
      for the gate.
    doesNotRedefine: true
    mapping:
      governance-existence: GovernanceAndExistence
      supply-resources: SupplyAndResources
      people-organization: PeopleAndOrganization
      customer-demand: CustomerAndDemand
      product-offering: ProductAndOffering
      operations-delivery: OperationsAndDelivery
      finance-value: FinanceAndValue
      _stage_conceive: Conceive
      _stage_design: Design
      _stage_build: Build
      _stage_activate: Activate
      _stage_operate: Operate
      _stage_improve: Improve
      _stage_retire: Retire
  - name: multiple-contextual-coordinates
    kind: catalog-specific-relation
    description: A capability may have one primary and zero-or-more secondary canonical
      coordinates without identity duplication (CG-003 §5).
    doesNotRedefine: true
  - name: held-unmapped
    kind: classification-state
    description: State for capabilities with no ECF affiliation by design (N-006);
      does not appear on this entry because primary is set.
    doesNotRedefine: true
