id: dea:capability-asset-management
type: BusinessCapability
name: Asset Management
definition: The ability to steward the enterprise's non-financial, non-workforce assets across their lifecycle.
version: 1.0.0
lifecycle_status: active
capability_layer: support
outcome: Assets are known, maintained, utilized, and retired deliberately.
business_object: Asset
ecf:
  primary:
    domain: supply-resources
    stage: build
  secondary:
  - domain: supply-resources
    stage: operate
  - domain: supply-resources
    stage: retire
related_capabilities:
- dea:capability-facility-management
evidence:
  sources:
  - SRC-002
  - SRC-004
  rationale: Enterprise-generality demonstrated at E3; evidence trail in docs/research (evidence-register, enterprise-generality-matrix,
    distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8, #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: E3; parent of Facility Management per the sweep (facilities are the asset class large enough to warrant its
  own first-order capability).
ecf_rationale: Primary build in supply-resources; operated and retired across the asset lifecycle.
boundary: Stewards assets; does not manage money (Financial Management), technology as an estate (Technology Management),
  or facilities specifically (Facility Management).
non_examples:
- An asset register (an artifact)
- A CMMS (a system)
specialization_boundary: Asset classes (fleet, plant, spectrum rights) are specialization; the ability to steward assets is
  not.
