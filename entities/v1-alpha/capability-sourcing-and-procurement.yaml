id: dea:capability-sourcing-and-procurement
type: BusinessCapability
name: Sourcing and Procurement
definition: 'The ability to acquire goods and services: sourcing choices, purchasing, and receipt.'
version: 1.0.0
lifecycle_status: active
capability_layer: operational
outcome: The enterprise obtains what it needs, at deliberate terms, with a clean acquisition record.
business_object: Purchase Order
ecf:
  primary:
    domain: supply-resources
    stage: build
  secondary:
  - domain: supply-resources
    stage: operate
related_capabilities:
- dea:capability-supplier-management
evidence:
  sources:
  - SRC-002
  - SRC-004
  - SRC-005
  rationale: Enterprise-generality demonstrated at E4; evidence trail in docs/research (evidence-register, enterprise-generality-matrix,
    distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8, #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: E4; distinct from Supplier Management (the relationship) per the sweep; object is the Purchase Order.
ecf_rationale: Primary build in supply-resources (acquisition builds the supply position); operated thereafter.
boundary: Executes acquisition; does not manage supplier relationships (Supplier Management) or the acquired assets (Asset
  Management).
non_examples:
- A procurement suite (a system)
- Invoice Processing (a process, CAND-031)
specialization_boundary: Acquisition regimes (public tendering, framework agreements) are obligation sets, not specializations
  of the ability.
