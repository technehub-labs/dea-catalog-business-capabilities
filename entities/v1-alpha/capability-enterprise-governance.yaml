id: dea:capability-enterprise-governance
type: BusinessCapability
name: Enterprise Governance
definition: 'The ability to direct and control the enterprise: decision rights, accountability,
  oversight, and policy across the whole.'
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: strategic
outcome: Decisions are made by the right authority, recorded, and enforced; the enterprise
  remains answerable to its principals.
business_object: Decision
ecf:
  primary:
    domain: governance-existence
    stage: conceive
  secondary:
  - domain: governance-existence
    stage: operate
  - domain: governance-existence
    stage: improve
related_capabilities:
- dea:capability-strategy
- dea:capability-risk-management
evidence:
  sources:
  - SRC-001
  - SRC-002
  - SRC-004
  rationale: Enterprise-generality demonstrated at E3; evidence trail in docs/research
    (evidence-register, enterprise-generality-matrix, distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8,
      #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: Governance of the enterprise-as-a-whole is enterprise-general and
  implementation-independent; distinct from Risk, Compliance, and Legal by the distinctness
  sweep.
ecf_rationale: Primary conceive in governance-existence (governance is constituted
  with the enterprise); exercised continuously at operate and improve.
boundary: Governs the enterprise; does not manage specific obligation classes (Compliance,
  Legal), exposure (Risk), or change (Change Management).
non_examples:
- A board meeting (an event)
- A policy document (an artifact)
specialization_boundary: Governance instruments (boards, councils, assemblies) vary
  by sector and ownership form; the ability to govern does not.
ecfConformance:
  framework: EnterpriseConceptFramework
  contractVersion: 1.0.0
  profile: dea:ecf@1.0.0
  status: conformant-with-extension
  affiliation: mapped
  canonicalReferences:
  - kind: coordinate
    domain: GovernanceAndExistence
    stage: Conceive
    identifier: ecf:governanceExistence.conceive
    schema: https://github.com/technehub-labs/dea-metaframework/schemas/ecf-coordinate.schema.json
    role: primary
  - kind: coordinate
    domain: GovernanceAndExistence
    stage: Operate
    identifier: ecf:governanceExistence.operate
    schema: https://github.com/technehub-labs/dea-metaframework/schemas/ecf-coordinate.schema.json
    role: secondary
  - kind: coordinate
    domain: GovernanceAndExistence
    stage: Improve
    identifier: ecf:governanceExistence.improve
    schema: https://github.com/technehub-labs/dea-metaframework/schemas/ecf-coordinate.schema.json
    role: secondary
  extensions:
  - name: kebab-case-domain-vocabulary
    kind: display-vocabulary
    description: Catalog-side kebab-case labels for the seven ECF Domains and seven
      ECF Stages (see mapping). Display-only; resolves to canonical PascalCase enums
      for the gate.
    doesNotRedefine: true
    mapping:
      governance-existence: GovernanceAndExistence
      supply-resources: SupplyAndResources
      people-organization: PeopleAndOrganization
      customer-demand: CustomerAndDemand
      product-offering: ProductAndOffering
      operations-delivery: OperationsAndDelivery
      finance-value: FinanceAndValue
      _stage_conceive: Conceive
      _stage_design: Design
      _stage_build: Build
      _stage_activate: Activate
      _stage_operate: Operate
      _stage_improve: Improve
      _stage_retire: Retire
  - name: multiple-contextual-coordinates
    kind: catalog-specific-relation
    description: A capability may have one primary and zero-or-more secondary canonical
      coordinates without identity duplication (CG-003 §5).
    doesNotRedefine: true
  - name: held-unmapped
    kind: classification-state
    description: State for capabilities with no ECF affiliation by design (N-006);
      does not appear on this entry because primary is set.
    doesNotRedefine: true
