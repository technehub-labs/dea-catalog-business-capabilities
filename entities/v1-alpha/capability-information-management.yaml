id: dea:capability-information-management
type: BusinessCapability
name: Information Management
definition: The ability to govern, structure, and steward the enterprise's information across its lifecycle.
version: 1.0.0
lifecycle_status: active
capability_layer: support
outcome: Information is findable, trustworthy, retained correctly, and disposed of deliberately.
business_object: Information
ecf:
  primary:
    domain: operations-delivery
    stage: operate
  secondary: []
related_capabilities:
- dea:capability-technology-management
evidence:
  sources:
  - SRC-002
  - SRC-004
  rationale: Enterprise-generality demonstrated at E4; evidence trail in docs/research (evidence-register, enterprise-generality-matrix,
    distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8, #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: 'E4; span across domains resolved at review (R-003): the span is a property of the business object, not of
  initiation.'
ecf_rationale: 'R-003: primary operations-delivery x operate; secondaries deliberately empty (honest-not-exhaustive).'
boundary: Manages information; does not manage the technology that carries it (Technology Management) or produce analytics
  from it (Analytics and Intelligence, deferred).
non_examples:
- A database (technology)
- A report (an artifact)
specialization_boundary: Information classes (health records, call detail records, case files) are specialization; the ability
  to manage information is not.
