id: capabilities:capability-audit-and-assurance-management-n7qv25
type: BusinessCapability
name: Audit and Assurance Management
definition: The ability to independently examine operations and controls, report findings, and track remediation
  to closure.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: support
purpose: The enterprise requires Audit and Assurance Management so control weaknesses surface independently
  and close with verified remediation.
outcome: Findings are independent, material, and remediated to closure.
business_object: Audit Finding
ecf:
  primary:
    domain: governance-existence
    stage: improve
  secondary:
  - domain: governance-existence
    stage: operate
related_capabilities:
- capabilities:capability-risk-management-h9uxdw
- capabilities:capability-enterprise-governance-uas48u
- capabilities:capability-change-management-hukdeq
evidence:
  sources:
  - SRC-023
  - SRC-026
  - SRC-027
  rationale: 'Business-object demand: 3 canonical objects in the cluster (audit-finding, lessons-learned,
    improvement-proposal; SRC-026) reference no capability, and the governance-existence/improve cell
    is empty; cross-signal convergence recorded in the coverage-gap register (SRC-027); ability class
    corroborated against cross-industry process classification (SRC-023).'
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, coverage-gap candidate register C-10 (CR-DEA-BC-62)
  - stage: observed
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, business-object demand scan (SRC-026): 3 canonical objects in the cluster
      reference no capability'
  - stage: corroborated
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, cross-signal convergence in the coverage-gap register (SRC-027): ECF
      cell + object cluster + process-mirror signals agree'
  - stage: normalized
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, distinctness pass against neighbouring capabilities recorded in boundary
  - stage: ecf-mapped
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, ECF overlay (governance-existence / improve)
  - stage: reviewed
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission review under the CR-DEA-BC-62 tranche method
  - stage: canonical
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission PR (tranche T4)
specialization:
  allowed: true
  industry_examples: []
why_capability: Object-demand evidence at density 3 (SRC-026 cluster) with the governance-existence/improve
  cell empty before admission; distinct from Risk Management (anticipating exposure) and Enterprise Governance
  (owning the controls examined). Enterprise-generality level pending the next generality-matrix refresh
  (CR-DEA-BC-62 method).
ecf_rationale: 'Mapped at admission under the CR-DEA-BC-13 semantic-center-of-gravity rule. The defining
  activity of Audit and Assurance Management is independent examination feeding improvement (improve);
  ongoing assurance activity (operate) participates but does not define it. Cell occupancy: governance-existence/{improve,
  operate} (operate deepened).'
boundary: Examines and reports independently; does not own the controls it examines (Enterprise Governance)
  or remediate findings (the owning capabilities).
non_examples:
- An audit report (an artifact)
- A findings tracker (a system)
specialization_boundary: Audit types (financial, operational, compliance) are specialization; the independent-examination
  ability is not.
