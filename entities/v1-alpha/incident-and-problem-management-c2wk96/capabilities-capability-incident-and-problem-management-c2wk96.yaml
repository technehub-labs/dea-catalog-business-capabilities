id: capabilities:capability-incident-and-problem-management-c2wk96
type: BusinessCapability
name: Incident and Problem Management
definition: The ability to detect, triage, resolve, and learn from incidents and problems so service disruption
  is minimized and root causes are addressed.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: operational
purpose: The enterprise requires Incident and Problem Management so service disruption is contained quickly
  and recurrence is engineered out.
outcome: Incidents are resolved fast and problems do not recur.
business_object: Incident
ecf:
  primary:
    domain: enablement-operations
    stage: improve
  secondary:
  - domain: enablement-operations
    stage: operate
related_capabilities:
- capabilities:capability-operations-management-pm3w8k
- capabilities:capability-technology-enablement-y6nkws
- capabilities:capability-continuity-management-v3rn6u
evidence:
  sources:
  - SRC-023
  - SRC-026
  - SRC-027
  rationale: 'Business-object demand: 4 canonical objects in the cluster (incident, ticket, configuration-item,
    environment; SRC-026) reference no capability, and the enablement-operations/improve cell is empty;
    cross-signal convergence recorded in the coverage-gap register (SRC-027); ability class corroborated
    against cross-industry process classification (SRC-023).'
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, coverage-gap candidate register C-11 (CR-DEA-BC-62)
  - stage: observed
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, business-object demand scan (SRC-026): 4 canonical objects in the cluster
      reference no capability'
  - stage: corroborated
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, cross-signal convergence in the coverage-gap register (SRC-027): ECF
      cell + object cluster + process-mirror signals agree'
  - stage: normalized
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, distinctness pass against neighbouring capabilities recorded in boundary
  - stage: ecf-mapped
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, ECF overlay (enablement-operations / improve)
  - stage: reviewed
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission review under the CR-DEA-BC-62 tranche method
  - stage: canonical
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission PR (tranche T4)
specialization:
  allowed: true
  industry_examples: []
why_capability: Object-demand evidence at density 4 (SRC-026 cluster) with the enablement-operations/improve
  cell empty before admission; distinct from Operations Management (steady-state run) and Continuity Management
  (major-disruption survivability). Enterprise-generality level pending the next generality-matrix refresh
  (CR-DEA-BC-62 method).
ecf_rationale: 'Mapped at admission under the CR-DEA-BC-13 semantic-center-of-gravity rule. The defining
  activity of Incident and Problem Management is learning from disruption (improve); restoration work
  (operate) participates but the root-cause elimination is the center of gravity. Cell occupancy: enablement-operations/{improve,
  operate} (operate deepened).'
boundary: Restores and learns; does not run steady-state operations (Operations Management), manage technology
  platforms (Technology Enablement), or survive major disruption (Continuity Management).
non_examples:
- A ticket queue (an artifact)
- An IT service-management tool (a system)
specialization_boundary: Incident classes (service, security) are specialization; the restore-and-learn
  ability is not.
