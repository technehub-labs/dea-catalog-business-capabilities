specialization:
  allowed: true
  industry_examples: []
why_capability: Object-demand evidence at density 5 (SRC-026 cluster) with the strategy-direction/design
  cell empty before admission; distinct from Strategy Formulation (choosing direction), Enterprise Performance
  Management (measuring outcomes), and Change Management (executing change). Enterprise-generality level
  pending the next generality-matrix refresh (CR-DEA-BC-62 method).
ecf_rationale: 'Mapped at admission under the CR-DEA-BC-13 semantic-center-of-gravity rule. The defining
  activity of Portfolio and Investment Management is portfolio selection and shaping (design); funding
  (build) and business-case conception (finance-accounting/conceive) participate but do not define it.
  Cell occupancy: strategy-direction/{design, build}, finance-accounting/conceive (deepened).'
boundary: Selects and oversees the investment portfolio; does not formulate strategy (Strategy Formulation),
  execute initiatives (Change Management), or measure performance (Enterprise Performance Management).
non_examples:
- A project plan (an artifact)
- A portfolio-management tool (a system)
specialization_boundary: Portfolio slices (technology, transformation) are specialization; the investment-selection
  ability is not.
