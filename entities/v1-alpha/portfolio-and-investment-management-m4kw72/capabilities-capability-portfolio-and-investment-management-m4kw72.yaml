id: capabilities:capability-portfolio-and-investment-management-m4kw72
type: BusinessCapability
name: Portfolio and Investment Management
definition: The ability to select, prioritize, fund, and oversee the portfolio of initiatives and investments
  against strategic direction.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: strategic
purpose: The enterprise requires Portfolio and Investment Management so constrained investment flows to
  the initiatives that best serve the strategy.
outcome: The initiative portfolio traces to strategy and earns its funding.
business_object: Project
ecf:
  primary:
    domain: strategy-direction
    stage: design
  secondary:
