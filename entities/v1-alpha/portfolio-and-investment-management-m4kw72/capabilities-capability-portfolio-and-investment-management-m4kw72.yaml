  - SRC-027
  rationale: 'Business-object demand: 5 canonical objects in the cluster (project, business-case, transformation-plan,
    budget, grant; SRC-026) reference no capability, and the strategy-direction/design cell is empty;
    cross-signal convergence recorded in the coverage-gap register (SRC-027); ability class corroborated
    against cross-industry process classification (SRC-023).'
