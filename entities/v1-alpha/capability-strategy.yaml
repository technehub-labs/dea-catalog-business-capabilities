id: dea:capability-strategy
type: BusinessCapability
name: Strategy
definition: 'The ability to set the enterprise''s direction: where it will compete, what it will become, and what it will
  not do.'
version: 1.0.0
lifecycle_status: active
capability_layer: strategic
outcome: An explicit, current statement of enterprise direction that constrains and guides every other capability.
business_object: Enterprise
ecf:
  primary:
    domain: governance-existence
    stage: conceive
  secondary:
  - domain: governance-existence
    stage: improve
related_capabilities:
- dea:capability-strategic-planning
- dea:capability-enterprise-governance
evidence:
  sources:
  - SRC-001
  - SRC-002
  - SRC-004
  rationale: Enterprise-generality demonstrated at E3; evidence trail in docs/research (evidence-register, enterprise-generality-matrix,
    distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8, #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: 'Direction-setting is exercised by every enterprise regardless of industry or implementation, is identifiable
  by its outcome, and passes the anti-invention test: every corpus source carries it.'
ecf_rationale: 'Earliest initiation is conceive in governance-existence: strategy exists from the moment the enterprise is
  conceived; it is exercised again at improve.'
boundary: Sets direction; does not plan its pursuit (Strategic Planning), govern its execution (Enterprise Governance), or
  deliver value (Operations).
non_examples:
- A strategic plan document (an artifact of Strategic Planning)
- A board decision (an act of Enterprise Governance)
specialization_boundary: What is being strategized (a product line, a nation, a network) is specialization; the ability to
  strategize is not.
