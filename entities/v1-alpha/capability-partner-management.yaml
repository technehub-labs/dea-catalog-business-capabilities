id: dea:capability-partner-management
type: BusinessCapability
name: Partner Management
definition: The ability to establish and maintain relationships with entities the enterprise cooperates with as peers.
version: 1.0.0
lifecycle_status: active
capability_layer: operational
outcome: A deliberate portfolio of alliances, channels, and ecosystem relationships.
business_object: Partner
ecf:
  primary:
    domain: customer-demand
    stage: conceive
  secondary:
  - domain: supply-resources
    stage: operate
related_capabilities:
- dea:capability-customer-management
- dea:capability-supplier-management
evidence:
  sources:
  - SRC-002
  - SRC-004
  rationale: Enterprise-generality demonstrated at E3; evidence trail in docs/research (evidence-register, enterprise-generality-matrix,
    distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8, #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: 'Enterprise-general (E3); the dual-home ECF tension was resolved at review (R-001): the tension is inherent
  to partnering and is expressed, not smoothed.'
ecf_rationale: 'R-001: first initiated when the enterprise conceives its demand-side relationships (customer-demand x conceive);
  supply-side operation is legitimate participation.'
boundary: Manages peer relationships; does not manage suppliers (Supplier Management) or customers (Customer Management).
non_examples:
- A joint venture entity (an organization)
- A partnership agreement (an artifact)
specialization_boundary: Partner forms (reseller, alliance, roaming partner) are specialization; the ability to partner is
  not.
