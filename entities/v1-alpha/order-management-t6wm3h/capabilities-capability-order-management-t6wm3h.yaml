id: capabilities:capability-order-management-t6wm3h
type: BusinessCapability
name: Order Management
definition: The ability to capture, validate, fulfil, and close customer orders across their commercial
  lifecycle.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: operational
purpose: The enterprise requires Order Management so committed customer orders are fulfilled accurately
  and closed without revenue leakage.
outcome: Orders are fulfilled completely, accurately, and on time.
business_object: Order
ecf:
  primary:
    domain: party-relationship
    stage: operate
  secondary:
  - domain: finance-accounting
    stage: operate
  - domain: product-value
    stage: operate
related_capabilities:
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-billing-and-revenue-management-k7mwq2
- capabilities:capability-supplier-management-d6fuj4
evidence:
  sources:
  - SRC-023
  - SRC-026
  - SRC-027
  rationale: 'Business-object demand: 6 canonical objects in the cluster (order, quote, price-list, contract,
    purchase-order, return; SRC-026) reference no capability; cross-signal convergence recorded in the
    coverage-gap register (SRC-027); ability class corroborated against cross-industry process classification
    (SRC-023).'
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, coverage-gap candidate register C-03 (CR-DEA-BC-62)
  - stage: observed
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, business-object demand scan (SRC-026): 6 canonical objects in the cluster
      reference no capability'
  - stage: corroborated
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, cross-signal convergence in the coverage-gap register (SRC-027): ECF
      cell + object cluster + process-mirror signals agree'
  - stage: normalized
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, distinctness pass against neighbouring capabilities recorded in boundary
  - stage: ecf-mapped
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, ECF overlay (party-relationship / operate)
  - stage: reviewed
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission review under the CR-DEA-BC-62 tranche method
  - stage: canonical
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission PR (tranche T2)
specialization:
  allowed: true
  industry_examples: []
why_capability: Object-demand evidence at density 6 (SRC-026 cluster) with the order-to-fulfilment lifecycle
  unowned; distinct from Offering Management (the offer) and Billing and Revenue Management (the charge).
  Enterprise-generality level pending the next generality-matrix refresh (CR-DEA-BC-62 method).
ecf_rationale: 'Mapped at admission under the CR-DEA-BC-13 semantic-center-of-gravity rule. The defining
  activity of Order Management is order lifecycle management (party-relationship/operate); the billing
  handoff (finance-accounting/operate) and fulfilment interface (product-value/operate) participate but
  do not define it. Cell occupancy: party-relationship/operate (deepened), finance-accounting/operate
  (deepened), product-value/operate (deepened).'
boundary: Owns the order lifecycle; does not negotiate the offer (Offering Management), bill the order
  (Billing and Revenue Management), or source the goods (Sourcing and Procurement).
non_examples:
- An order form (an artifact)
- An order-management system (a system)
specialization_boundary: Order kinds (sales, purchase, return) are specialization; the order lifecycle
  ability is not.
