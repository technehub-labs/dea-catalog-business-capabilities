id: dea:capability-compliance-management
type: BusinessCapability
name: Compliance Management
definition: The ability to know the enterprise's obligations and to conform to them demonstrably.
version: 1.0.0
lifecycle_status: active
capability_layer: support
outcome: Obligations are identified, interpreted, met, and the conformance is provable.
business_object: Regulation
ecf:
  primary:
    domain: governance-existence
    stage: activate
  secondary:
  - domain: governance-existence
    stage: operate
related_capabilities:
- dea:capability-risk-management
evidence:
  sources:
  - SRC-001
  - SRC-002
  - SRC-004
  - SRC-005
  rationale: Enterprise-generality demonstrated at E4; evidence trail in docs/research (evidence-register, enterprise-generality-matrix,
    distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8, #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: E4; distinct from Risk (exposure) and Legal (counsel) per the sweep.
ecf_rationale: Primary activate in governance-existence (compliance is activated when obligations bind); operated thereafter.
boundary: Manages conformance; does not assess exposure (Risk Management) or conduct legal work (Legal Management).
non_examples:
- A compliance tool (a system)
- An audit (an assurance event)
specialization_boundary: Obligation sets (telecom license conditions, HIPAA, PSD2) are specialization; the ability to comply
  is not.
