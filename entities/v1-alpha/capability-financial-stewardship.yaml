specialization:
  allowed: true
  industry_examples: []
why_capability: 'E5; distinct from Financial Management (the operating cycle) by the sweep: stewardship sets the financial
  constitution, management runs it.'
ecf_rationale: Primary conceive in finance-value (financial position is constituted deliberately); exercised at operate.
boundary: Stewards financial position; does not run the accounting cycle or execute transactions (Financial Management).
non_examples:
- A ledger (the object of Financial Management)
- A treasury desk (an organization)
specialization_boundary: Instruments and capital structures vary by sector; the ability to steward financial position does
  not.
