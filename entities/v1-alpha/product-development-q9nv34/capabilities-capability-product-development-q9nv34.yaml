id: capabilities:capability-product-development-q9nv34
type: BusinessCapability
name: Product Development
definition: The ability to take product concepts through requirements, design, build, and release to market
  readiness.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: operational
purpose: The enterprise requires Product Development so market-ready products carry validated requirements
  into build and release.
outcome: Products reach release with requirements validated and defects managed.
business_object: Product
ecf:
  primary:
    domain: product-value
    stage: design
  secondary:
  - domain: product-value
    stage: build
  - domain: product-value
    stage: activate
related_capabilities:
- capabilities:capability-offering-management-6egkc8
- capabilities:capability-idea-management-86dckf
- capabilities:capability-marketing-xmc539
evidence:
  sources:
  - SRC-023
  - SRC-026
  - SRC-027
  rationale: 'Business-object demand: 4 canonical objects in the cluster (product, requirement, release-candidate,
    forecast; SRC-026) reference no capability, and the product-value/design cell is empty; cross-signal
    convergence recorded in the coverage-gap register (SRC-027); ability class corroborated against cross-industry
    process classification (SRC-023).'
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, coverage-gap candidate register C-07 (CR-DEA-BC-62)
  - stage: observed
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, business-object demand scan (SRC-026): 4 canonical objects in the cluster
      reference no capability'
  - stage: corroborated
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, cross-signal convergence in the coverage-gap register (SRC-027): ECF
      cell + object cluster + process-mirror signals agree'
  - stage: normalized
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, distinctness pass against neighbouring capabilities recorded in boundary
  - stage: ecf-mapped
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, ECF overlay (product-value / design)
  - stage: reviewed
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission review under the CR-DEA-BC-62 tranche method
  - stage: canonical
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission PR (tranche T3)
specialization:
  allowed: true
  industry_examples: []
why_capability: Object-demand evidence at density 4 (SRC-026 cluster) with the product-value/design cell
  empty before admission; distinct from Idea Management (conception) and Offering Management (the commercial
  offer). Enterprise-generality level pending the next generality-matrix refresh (CR-DEA-BC-62 method).
ecf_rationale: 'Mapped at admission under the CR-DEA-BC-13 semantic-center-of-gravity rule. The defining
  activity of Product Development is product definition through design; build and launch (activate) participate
  as lifecycle events but the center of gravity is the design passage. Cell occupancy: product-value/{design,
  build, activate}.'
boundary: Takes products to market readiness; does not conceive market offers (Idea Management, Offering
  Management) or run products in market (Marketing).
non_examples:
- A product backlog (an artifact)
- A product-lifecycle system (a system)
specialization_boundary: Product kinds (physical, digital) are specialization; the development ability
  is not.
