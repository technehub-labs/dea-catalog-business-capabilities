specialization:
  allowed: true
  industry_examples: []
why_capability: Object-demand evidence at density 4 (SRC-026 cluster) with the agency-organization/operate
  cell empty before admission; distinct from Workforce Planning (demand), Workforce Management (deployment),
  and Organizational Design (structure). Enterprise-generality level pending the next generality-matrix
  refresh (CR-DEA-BC-62 method).
ecf_rationale: 'Mapped at admission under the CR-DEA-BC-13 semantic-center-of-gravity rule. The defining
  activity of Talent Management is day-to-day employment lifecycle stewardship (operate); onboarding (activate)
  and separation (retire) are lifecycle endpoints that participate but do not define it. Cell occupancy:
  agency-organization/{activate, operate, retire}.'
boundary: Stewards the employment lifecycle; does not plan workforce demand (Workforce Planning), deploy
  people to work (Workforce Management), or design the organization (Organizational Design).
non_examples:
- An employee handbook (an artifact)
- An HRIS (a system)
specialization_boundary: Employee segments (executive, contingent workforce) are specialization; the lifecycle
  stewardship ability is not.
