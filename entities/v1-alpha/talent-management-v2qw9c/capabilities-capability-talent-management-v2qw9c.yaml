id: capabilities:capability-talent-management-v2qw9c
type: BusinessCapability
name: Talent Management
definition: The ability to steward the employee lifecycle from hire through development, performance,
  and separation so the workforce agreement with each employee is governed end to end.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: support
purpose: The enterprise requires Talent Management so every employment journey from offer to separation
  is deliberate, compliant, and development-oriented.
outcome: Employees are onboarded, developed, reviewed, and separated deliberately.
business_object: Employee
ecf:
  primary:
    domain: agency-organization
    stage: operate
  secondary:
  - domain: agency-organization
    stage: activate
  - domain: agency-organization
    stage: retire
related_capabilities:
- capabilities:capability-workforce-management-9e8d8s
- capabilities:capability-workforce-planning-b43rhm
- capabilities:capability-organizational-design-vanefq
evidence:
  sources:
  - SRC-023
  - SRC-026
  - SRC-027
  rationale: 'Business-object demand: 4 canonical objects in the cluster (employee, onboarding-plan, offboarding-plan,
    performance-review; SRC-026) reference no capability, and the agency-organization/operate cell is
    empty; cross-signal convergence recorded in the coverage-gap register (SRC-027); ability class corroborated
    against cross-industry process classification (SRC-023).'
