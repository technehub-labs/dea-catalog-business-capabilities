id: dea:capability-offering-management
type: BusinessCapability
name: Offering Management
definition: The ability to conceive, design, build, evolve, and retire what the enterprise
  offers.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: operational
outcome: A deliberate offering portfolio whose lifecycle is managed end to end.
business_object: Offering
ecf:
  primary:
    domain: product-offering
    stage: conceive
  secondary:
  - domain: product-offering
    stage: design
  - domain: product-offering
    stage: build
  - domain: product-offering
    stage: improve
  - domain: product-offering
    stage: retire
related_capabilities:
- dea:capability-marketing
- dea:capability-operations
evidence:
  sources:
  - SRC-001
  - SRC-004
  rationale: Enterprise-generality demonstrated at E3; evidence trail in docs/research
    (evidence-register, enterprise-generality-matrix, distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8,
      #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: Enterprise-general; distinct from Marketing (demand creation) and
  Operations (delivery) by the sweep.
ecf_rationale: Primary conceive in product-offering; participates through the full
  offering lifecycle (design, build, improve, retire).
boundary: Manages the offering; does not create demand for it (Marketing) or operate
  its delivery (Operations).
non_examples:
- A product backlog (an artifact)
- A product team (an organization)
specialization_boundary: What is offered (a tariff plan, a policy, a public service)
  is specialization; the ability to manage offerings is not.
ecfConformance:
