  - SRC-017
  - SRC-018
  - SRC-019
  rationale: "Admission per CR-DEA-BC-14 (Track A of CR-DEA-BC-13 B.1 / BC-SR-A001 4). Evidence trail: BC-SR-A001 4 (reviewer's P1; the catalog had Strategy + Strategic Planning + Workforce Planning + Workforce Management but not the structural-design capability the ECF positions in agency-organization/design); CR-DEA-BC-13 B.1 (Track A investigation opened); CR-DEA-BC-13 D.1 (ECF overlay hypothesis + track record stub); CR-DEA-BC-18 (research-CR evidence package; no admission); CR-DEA-BC-14 3 (semantic review gate) + 4 (architectural review gate) + 5 (admission-gate closeout). Enterprise-generality demonstrated at E3 (organization-design literature is universal across B2B/B2C/G2C enterprises per foundation inclusion criteria gate A+B+C; 9 of 10 types strong in enterprise-generality matrix, 1 moderate; cross-industry evidence in SRC-017 Galbraith, SRC-018 APQC PCF Organization category, SRC-019 ISO 9001 5.3 organizational roles). Evidence trail on disk: catalog-research/{candidates, evidence-register, enterprise-generality-matrix, distinctness-sweep, admission-gate-precheck, preliminary-ecf-overlay, INV-ORGDESIGN-v0.2, INV-ORGDESIGN-v0.1.yaml}."
