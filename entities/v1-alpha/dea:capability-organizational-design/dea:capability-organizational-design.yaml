specialization:
  allowed: true
  industry_examples: []
why_capability: "E4 (foundation-grade per A+B+C gate; promotion from E3 at admission per EVIDENCE.md 3 admission promotion rule). BC-SR-A001 4 explicitly recommended this admission. CR-DEA-BC-13 B.1 carved Track A as a follow-on investigation; CR-DEA-BC-18 (research-CR) seeded the evidence package across three independent source classes (business-architecture / cross-industry-process / standards-body) and registered TER-ORGDESIGN-001 track record at E3; this CR closes the 4 evidence work and promotes to E4 on admission. Distinct business object (Organization Structure vs Workforce Management's Workforce Plan / Workforce Mgmt's Agent lifecycle / Strategy's Enterprise). Distinct ECF cell (agency-organization/design vs Workforce Planning at the same cell; distinctness passes by business-object partition; Organization Structure vs Workforce Plan)."
ecf_rationale: "Admitted 2026-09-11 under CR-DEA-BC-14. Under the semantic-center-of-gravity rule (CR-DEA-BC-13 A), the defining activity is sustained structuring of roles, authorities, units, and coordination patterns, squarely in the design axis of Agency & Organization. Secondaries: conceive (diagnostic/re-design) and build (operationalization). Distinct from Workforce Planning (same primary coordinate agency-organization/design) by business object; Organizational Design structures the enterprise (Organization Structure: roles, units, authorities), Workforce Planning sizes the demand-supply picture (Workforce Plan: capability and capacity at horizon). Peers; both inputs to Workforce Management."
boundary: "Designs the enterprise's roles, units, reporting lines, authorities, and coordination patterns. DOES NOT set direction (Strategy; the structural design serves the strategy, does not define it). DOES NOT plan the workforce against the structure (Workforce Planning; separate planning ability against the designed structure). DOES NOT execute the agent lifecycle (Workforce Management; operates the workforce against the structure). DOES NOT govern the enterprise (Enterprise Governance; sets the authority framework, OrgDesign implements it operationally). DOES NOT manage change processes (Change Management; operates change initiatives; structural redesign is one trigger of change, not the change process itself). DOES NOT steward the technology estate (Technology Management; IT strategy and acquisition). DOES NOT run technology services (Technology Enablement; IT delivery). The defining distinction: Organizational Design is the structural-design function; Workforce Planning is the workforce-demand-supply-planning function; Workforce Management is the agent-execution function."
non_examples:
- An organization chart (an artifact; the document of a structural decision)
- A reporting line (an artifact; one element of a structural decision)
- A specific role profile (an artifact; one role within a structure)
- A re-org event (a process; the act of implementing a structural change)
specialization_boundary: "Structural archetypes (functional, divisional, matrix, network, holacratic, ambidextrous), governance patterns (centralized, federated, hub-and-spoke), and coordination mechanisms (hierarchies, communities-of-practice, platform teams, cells, squads) vary by enterprise context; the ability to design and revise a structure does not. Specializations include enterprise architecture for the structure's information flows, HR-organization design for the role architecture, IT-organization design for the IT org structure (a sub-concern that Tech Mgmt coordinates per CR-DEA-BC-13 C), and post-merger integration for transition structures."
