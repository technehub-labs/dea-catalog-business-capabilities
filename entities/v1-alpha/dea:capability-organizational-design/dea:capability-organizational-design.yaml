id: dea:capability-organizational-design
type: BusinessCapability
name: Organizational Design
definition: The ability to structure the enterprise into roles, units, reporting
  lines, authorities, and coordination patterns that fit the work the enterprise
  must do, and to revise that structure when the work changes.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: strategic
outcome: The enterprise has a structure whose roles, authorities, and
  coordination patterns align with its strategy and operating context, and
  can be revised deliberately rather than drifting.
business_object: Organization Structure
ecf:
  primary:
    domain: agency-organization
    stage: design
  secondary:
  - domain: agency-organization
    stage: conceive
  - domain: agency-organization
    stage: build
related_capabilities:
- dea:capability-strategy
