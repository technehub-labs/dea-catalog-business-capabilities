id: dea:capability-security-management
type: BusinessCapability
name: Security Management
definition: The ability to protect the enterprise's people, assets, and information from harm.
version: 1.0.0
lifecycle_status: active
capability_layer: support
outcome: Protective posture is deliberate, proportionate, and demonstrably operating.
business_object: Asset/Information
ecf:
  primary:
    domain: governance-existence
    stage: design
  secondary:
  - domain: governance-existence
    stage: operate
related_capabilities:
- dea:capability-risk-management
evidence:
  sources:
  - SRC-002
  - SRC-004
  rationale: Enterprise-generality demonstrated at E3; evidence trail in docs/research (evidence-register, enterprise-generality-matrix,
    distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8, #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: E3; object spans Asset and Information; distinct from Risk (exposure assessment) per the sweep.
ecf_rationale: Primary design in governance-existence (protective posture is designed, then operated).
boundary: Protects; does not own the risk appetite it protects to (Risk Management) or the assets themselves (Asset Management).
non_examples:
- A firewall (technology)
- A security operations center (an organization)
specialization_boundary: Security domains (physical, cyber, personnel) are specialization; the ability to protect is not.
