id: capabilities:capability-policy-management-w5qb87
type: BusinessCapability
name: Policy Management
definition: The ability to establish, maintain, and retire internal policies that direct enterprise conduct,
  and to govern their observance.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: support
purpose: The enterprise requires Policy Management so enterprise conduct is directed by current, observable,
  and governed policy rather than habit.
outcome: Conduct is policy-governed and policies are current and observable.
business_object: Policy
ecf:
  primary:
    domain: governance-existence
    stage: conceive
  secondary:
  - domain: governance-existence
    stage: activate
related_capabilities:
- capabilities:capability-enterprise-governance-uas48u
- capabilities:capability-regulation-management-gya4d8
- capabilities:capability-risk-management-h9uxdw
evidence:
  sources:
  - SRC-023
  - SRC-026
  - SRC-027
  rationale: 'Business-object demand: the policy object (SRC-026) references no capability despite being
    the written instrument of governance; cross-signal convergence recorded in the coverage-gap register
    (SRC-027); ability class corroborated against cross-industry process classification (SRC-023).'
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, coverage-gap candidate register C-08 (CR-DEA-BC-62)
  - stage: observed
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, business-object demand scan (SRC-026): 1 canonical objects in the cluster
      reference no capability'
  - stage: corroborated
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, cross-signal convergence in the coverage-gap register (SRC-027): ECF
      cell + object cluster + process-mirror signals agree'
  - stage: normalized
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, distinctness pass against neighbouring capabilities recorded in boundary
  - stage: ecf-mapped
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, ECF overlay (governance-existence / conceive)
  - stage: reviewed
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission review under the CR-DEA-BC-62 tranche method
  - stage: canonical
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission PR (tranche T3)
specialization:
  allowed: true
  industry_examples: []
why_capability: 'Object-demand evidence (the policy object, SRC-026) plus the governance-method gap: Regulation
  Management covers external obligations while internal policy has no owner; distinct from Enterprise
  Governance (the umbrella authority). Enterprise-generality level pending the next generality-matrix
  refresh (CR-DEA-BC-62 method).'
ecf_rationale: 'Mapped at admission under the CR-DEA-BC-13 semantic-center-of-gravity rule. The defining
  activity of Policy Management is policy conception and establishment (conceive); publication into force
  (activate) participates but does not define it. Cell occupancy: governance-existence/{conceive, activate}
  (both deepened).'
boundary: Governs internal policy; does not manage external regulations (Regulation Management) or the
  risk register (Risk Management).
non_examples:
- The policy binder (an artifact)
- A governance-risk-compliance platform (a system)
specialization_boundary: Policy families (HR, security, data) are specialization; the policy-governance
  ability is not.
