specialization:
  allowed: true
  industry_examples: []
why_capability: E3 (foundation-grade per A+B+C gate). BC-SR-A001 §12 explicitly recommended this admission.
  CR-DEA-BC-13 §C carved out the Technology-as-Enabler sub-concern; this CR admits it as a first-order
  capability. Distinct business object (Technology Service vs Technology Estate) and distinct ECF cell
  (enablement-operations/operate vs strategy-direction/build) from Technology Management. Distinct from
  Operations (delivery of value vs delivery of technology for value delivery).
ecf_rationale: 'Admitted 2026-09-10 under CR-DEA-BC-17. Under the new semantic-center-of-gravity rule
  (CR-DEA-BC-13 §A), the defining activity of Technology Enablement is sustained IT service and platform
  delivery (operate): running, monitoring, adapting technology services for the capabilities that depend
  on them. Secondary coordinates: build (provisioning new services as demand requires) and improve (SRE/platform
  engineering iteration). Distinct from Technology Management (strategy-direction/build): Technology Management
  stewards the estate (what technology the enterprise has); Technology Enablement runs the services (how
  that technology operates for others). The ECF places technology as enablers of execution (BC-SR-A001
  §15 quote: ''Technology, platforms, and physical infrastructure are positioned as enablers of execution''),
  which is exactly the enablement-operations domain and the operate stage.'
boundary: 'Runs technology services, platforms, automation, and observability for the rest of the enterprise.
  DOES NOT build/acquire the technology estate (Technology Management: strategic posture and acquisition);
  DOES NOT derive insight from information (Analytics and Intelligence); DOES NOT steward information
  lifecycles (Information Management); DOES NOT run business operations (Operations: value delivery),
  or design the IT organization structure (Organizational Design: IT org design is a sub-concern). The
  defining distinction: Technology Enablement is the IT delivery function; Technology Management is the
  IT direction function.'
non_examples:
- 'An IT department (an organization: the function may be performed by one)'
- 'A specific platform (a system: the capability operates platforms but is not one)'
- 'An SLO (an artifact: the outcome, not the capability)'
specialization_boundary: IT service management (incident, problem, change), platform engineering (internal
  developer platforms, paved roads), site reliability engineering (SLOs, error budgets, on-call), automation
  engineering (RPA, workflow automation, agentic automation), and data platform engineering are specializations
  of this capability. The ability to run technology services is NOT a specialization of any other capability.
