id: capabilities:capability-billing-and-revenue-management-k7mwq2
type: BusinessCapability
name: Billing and Revenue Management
definition: The ability to compute, issue, collect, and reconcile customer charges and invoices so rendered
  services convert into recognized revenue.
version: 1.0.0
metamodel_pin: 1.0.0
lifecycle_status: active
capability_layer: operational
purpose: The enterprise requires Billing and Revenue Management so rendered services convert reliably
  into collected, recognized revenue with a defensible audit trail.
outcome: Charges are billed accurately, collected on time, and reconciled to revenue.
business_object: Invoice
ecf:
  primary:
    domain: finance-accounting
    stage: operate
  secondary:
  - domain: finance-accounting
    stage: improve
  - domain: party-relationship
    stage: operate
related_capabilities:
- capabilities:capability-customer-management-f3n8wb
- capabilities:capability-financial-resource-management-cd3c7c
- capabilities:capability-sourcing-and-procurement-esucp4
evidence:
  sources:
  - SRC-023
  - SRC-026
  - SRC-027
  rationale: 'Business-object demand: 4 canonical objects in the cluster (invoice, credit-note, payment,
    tax-record; SRC-026) reference no capability; cross-signal convergence (ECF cell, object cluster,
    process mirror) recorded in the coverage-gap register (SRC-027); ability class corroborated against
    cross-industry process classification (SRC-023).'
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, coverage-gap candidate register C-01 (CR-DEA-BC-62)
  - stage: observed
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, business-object demand scan (SRC-026): 4 canonical objects in the cluster
      reference no capability'
  - stage: corroborated
    date: '2026-10-31'
    actor: 'Emmanuel A. Otchere, cross-signal convergence in the coverage-gap register (SRC-027): ECF
      cell + object cluster + process-mirror signals agree'
  - stage: normalized
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, distinctness pass against neighbouring capabilities recorded in boundary
  - stage: ecf-mapped
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, ECF overlay (finance-accounting / operate)
  - stage: reviewed
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission review under the CR-DEA-BC-62 tranche method
  - stage: canonical
    date: '2026-10-31'
    actor: Emmanuel A. Otchere, admission PR (tranche T1)
specialization:
  allowed: true
  industry_examples: []
why_capability: Object-demand evidence at density 4 (SRC-026 cluster) with the finance-accounting/operate
  cell's revenue-cycle scope unoccupied before admission; distinct from Financial Resource Management
  (stewardship of the money) and Customer Management (the relationship, not the charge). Enterprise-generality
  level pending the next generality-matrix refresh (CR-DEA-BC-62 method).
ecf_rationale: 'Mapped at admission under the CR-DEA-BC-13 semantic-center-of-gravity rule. The defining
  activity of Billing and Revenue Management is the sustained billing and collection of charges (operate);
  rating design (improve) and the customer-account interface (party-relationship/operate) participate
  but do not define it. Cell occupancy: finance-accounting/{operate, improve}.'
boundary: Converts rendered service into cash; does not set prices (Offering Management), manage the customer
  relationship (Customer Management), or steward the money once collected (Financial Resource Management).
non_examples:
- An invoice template (an artifact)
- A billing system (a system)
specialization_boundary: Billing models (prepaid, postpaid, converged) are specialization; the ability
  to convert service into collected revenue is not.
