id: dea:capability-operations
type: BusinessCapability
name: Operations
definition: The ability to run the enterprise's day-to-day production and delivery of value.
version: 1.0.0
lifecycle_status: active
capability_layer: operational
outcome: Offerings are delivered, continuously, at the quality the enterprise commits to.
business_object: Operation
ecf:
  primary:
    domain: operations-delivery
    stage: operate
  secondary:
  - domain: operations-delivery
    stage: improve
related_capabilities:
- dea:capability-offering-management
evidence:
  sources:
  - SRC-001
  - SRC-002
  - SRC-004
  - SRC-006
  rationale: Enterprise-generality demonstrated at E4; evidence trail in docs/research (evidence-register, enterprise-generality-matrix,
    distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8, #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: E4; N-008 dissolved Value Delivery as a separate first-order capability and re-rooted Operations as the value-execution
  capability.
ecf_rationale: Primary operate in operations-delivery; improve participation is honest and recorded.
boundary: Runs delivery; does not manage the offerings delivered (Offering Management) or change how delivery works (Change
  Management).
non_examples:
- A production line (a resource)
- An operations department (an organization)
specialization_boundary: What is operated (a network, a factory, a caseload) is specialization; the ability to operate is
  not.
