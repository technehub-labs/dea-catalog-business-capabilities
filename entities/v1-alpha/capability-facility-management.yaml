id: dea:capability-facility-management
type: BusinessCapability
name: Facility Management
definition: The ability to provide and operate the enterprise's physical places.
version: 1.0.0
lifecycle_status: active
capability_layer: support
outcome: Places are available, safe, fit for purpose, and cost-deliberate.
business_object: Facility
ecf:
  primary:
    domain: supply-resources
    stage: activate
  secondary:
  - domain: supply-resources
    stage: operate
related_capabilities:
- dea:capability-asset-management
evidence:
  sources:
  - SRC-002
  - SRC-004
  rationale: Enterprise-generality demonstrated at E3; evidence trail in docs/research (evidence-register, enterprise-generality-matrix,
    distinctness-sweep, admission-gate-closeout).
provenance:
  ladder_passage:
  - stage: candidate
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), candidate universe v0.1 (PR #6)'
  - stage: observed
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), evidence register (PRs #5, #7)'
  - stage: corroborated
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), enterprise-generality matrix (PR #11)'
  - stage: normalized
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), normalization register + distinctness sweep (PRs #8, #12)'
  - stage: ecf-mapped
    date: '2026-08-31'
    actor: 'Coder (for eaojnr), preliminary ECF overlay (PR #7)'
  - stage: reviewed
    date: '2026-09-01'
    actor: 'Coder (for eaojnr), admission review v0.1 (PR #24)'
  - stage: canonical
    date: '2026-09-01'
    actor: eaojnr, admission PR (this change)
specialization:
  allowed: true
  industry_examples: []
why_capability: E3; distinct child-level capability standing at first order per the sweep (facilities warrant their own ability;
  Asset Management remains the general case).
ecf_rationale: Primary activate in supply-resources (places are activated for use, then operated).
boundary: Operates places; does not steward the general asset base (Asset Management) or plan the workforce that staffs them
  (Workforce Planning).
non_examples:
- A building (an asset)
- A facilities vendor (a supplier)
specialization_boundary: Place types (offices, exchanges, depots, clinics) are specialization; the ability to operate places
  is not.
