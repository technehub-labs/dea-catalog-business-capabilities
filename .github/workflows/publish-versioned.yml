name: Publish versioned capability artifacts

# CR-DEA-BC-06: on every v* tag push, generates immutable versioned artifacts,
# creates a GitHub Release with a zip, and dispatches 'capabilities-versioned'
# to the central Pages aggregator.
#
# Tag format per CR-DEA-BC-05: v<N>-<word>.<P> for lettered-suffix versions
# (v1-alpha.0), v<N>.<M> from v2 onward.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-versioned
  cancel-in-progress: false

jobs:
  publish-versioned:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout dea-catalog-business-capabilities
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Generate /<tag>/ artifacts
        env:
          CI: 'true'
          GITHUB_SHA: ${{ github.sha }}
          VERSION_LABEL: ${{ github.ref_name }}
        run: node scripts/publish.js "$VERSION_LABEL"

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: capabilities-versioned-artifacts
          path: |
            out/${{ github.ref_name }}/
            out/${{ github.ref_name }}.zip
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ZIP=out/${VERSION_LABEL}.zip
          if gh release view "${VERSION_LABEL}" >/dev/null 2>&1; then
            echo "release exists; uploading new zip"
            gh release upload "${VERSION_LABEL}" "${ZIP}" --clobber
          else
            echo "creating release"
            gh release create "${VERSION_LABEL}" "${ZIP}" \
              --title "${VERSION_LABEL}" \
              --generate-notes
          fi

      - name: Dispatch to Pages aggregator
        if: success()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          VERSION_LABEL: ${{ github.ref_name }}
        run: |
          gh api repos/technehub-labs/technehub-labs.github.io/dispatches \
            -X POST \
            -f event_type=capabilities-versioned \
            -f client_payload='{"source":"dea-catalog-business-capabilities","commit":"${{ github.sha }}","version":"'"${VERSION_LABEL}"'"}' \
            --silent