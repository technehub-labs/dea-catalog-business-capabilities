name: Publish versioned capability artifacts

# CR-DEA-BC-06 + CR-DEA-BC-10: on every v* tag push, generates immutable
# versioned artifacts, creates a GitHub Release with a zip of those artifacts,
# and uploads the zip as a workflow-run artifact. Distribution is via GitHub
# Releases only. CR-DEA-BC-10 retired the central-aggregator Pages
# repository_dispatch path: the aggregator never wired up a consumer workflow
# for `capabilities-versioned` and the dispatch secret was unprovisioned, so
# the dispatch step failed on every run.
#
# CR-DEA-BC-06 was originally authored as CR-DEA-BC-08; renumbered to BC-10
# before merge because CR-DEA-BC-08 had already shipped as the Technology
# Management N-006R coordinate (PR #53, 2026-09-08).
#
# Tag format per CR-DEA-BC-05: v<N>-<word>.<P> for lettered-suffix versions
# (v1-alpha.0), v<N>.<M> from v2 onward.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-versioned
  cancel-in-progress: false

jobs:
  publish-versioned:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout dea-catalog-business-capabilities
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Generate /<tag>/ artifacts
        env:
          CI: 'true'
          GITHUB_SHA: ${{ github.sha }}
          VERSION_LABEL: ${{ github.ref_name }}
        run: node scripts/publish.js "$VERSION_LABEL"

      - name: Generate nested capability map (HTML + A3 PNG)
        env:
          VERSION_LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT_DIR="out/${VERSION_LABEL}"
          mkdir -p "${OUT_DIR}"
          python3 scripts/generate_capability_map.py \
            --label "${VERSION_LABEL}" \
            --out "${OUT_DIR}/capability-map.html"
          node scripts/render_map_png.mjs \
            "${OUT_DIR}/capability-map.html" \
            "${OUT_DIR}/capability-map-a3.png"

      - name: Rezip with map assets
        env:
          VERSION_LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT_DIR="out/${VERSION_LABEL}"
          cd "${OUT_DIR}"
          rm -f "../${VERSION_LABEL}.zip"
          zip -qr "../${VERSION_LABEL}.zip" .

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: capabilities-versioned-artifacts
          path: |
            out/${{ github.ref_name }}/
            out/${{ github.ref_name }}.zip
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ZIP=out/${VERSION_LABEL}.zip
          if gh release view "${VERSION_LABEL}" >/dev/null 2>&1; then
            echo "release exists; uploading new zip"
            gh release upload "${VERSION_LABEL}" "${ZIP}" --clobber
          else
            echo "creating release"
            gh release create "${VERSION_LABEL}" "${ZIP}" \
              --title "${VERSION_LABEL}" \
              --generate-notes
          fi
