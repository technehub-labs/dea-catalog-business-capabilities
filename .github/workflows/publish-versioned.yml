name: Publish versioned capability artifacts

# Release-pipeline consolidation (2026-09-09): on every v* tag push, generates
# the L0 ⊃ L1 ⊃ L2 nested ECF capability map (HTML + A3 landscape PNG) from
# the framework Python (scripts/generate_capability_map.py), zips the two
# artifacts, creates or updates the GitHub Release, and uploads the zip as a
# workflow-run artifact. Distribution is GitHub Releases only.
#
# This workflow supersedes the CR-DEA-BC-06 / CR-DEA-BC-10 pipeline
# (scripts/publish.js + scripts/publish-mockups/* + scripts/render_map_png.mjs
# + scripts/lib/* + .github/workflows/publish-latest.yml). Those files were
# retired 2026-09-09 in favour of a single canonical artifact family: the
# framework Python (CR-DEA-BC-11 release-pipeline consolidation).
#
# Consumers that pinned to the retired artifacts (poster.svg, catalog.svg,
# catalog.csv, catalog.json, overlay.yaml/json, dependencies.yaml, MANIFEST.md)
# must migrate to:
#   - capability-map.html  (the L0 ⊃ L1 ⊃ L2 grid + legend + attribution)
#   - capability-map-a3.png (A3 landscape @300 DPI raster of the same)
#
# Tag format per CR-DEA-BC-05: v<N>-<word>.<P> for lettered-suffix versions
# (v1-alpha.0), v<N>.<M> from v2 onward.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-versioned
  cancel-in-progress: false

jobs:
  publish-versioned:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout dea-catalog-business-capabilities
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (pinned via .python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          # weasyprint for HTML -> PDF; pdftoppm (poppler) for PDF -> PNG.
          python3 -m pip install weasyprint pyyaml
          # poppler-utils for pdftoppm (system package).
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Generate nested capability map (HTML + A3 PNG)
        env:
          VERSION_LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT_DIR="out/${VERSION_LABEL}"
          mkdir -p "${OUT_DIR}"
          python3 scripts/generate_capability_map.py \
            --label "${VERSION_LABEL}" \
            --out "${OUT_DIR}/capability-map.html" \
            --png "${OUT_DIR}/capability-map-a3.png" \
            --dpi 300

      - name: Rezip artifacts
        env:
          VERSION_LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT_DIR="out/${VERSION_LABEL}"
          cd "${OUT_DIR}"
          rm -f "../${VERSION_LABEL}.zip"
          zip -qr "../${VERSION_LABEL}.zip" .

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: capabilities-versioned-artifacts
          path: |
            out/${{ github.ref_name }}/
            out/${{ github.ref_name }}.zip
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ZIP=out/${VERSION_LABEL}.zip
          if gh release view "${VERSION_LABEL}" >/dev/null 2>&1; then
            echo "release exists; uploading new zip"
            gh release upload "${VERSION_LABEL}" "${ZIP}" --clobber
          else
            echo "creating release"
            gh release create "${VERSION_LABEL}" "${ZIP}" \
              --title "${VERSION_LABEL}" \
              --generate-notes
          fi