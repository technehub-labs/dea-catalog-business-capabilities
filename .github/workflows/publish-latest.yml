name: Publish latest capability artifacts

# CR-DEA-BC-06 + CR-DEA-BC-10: publishes mutable /latest/ artifacts on every
# push to main. Distribution is via the workflow-run artifact (debug) and the
# catalog's GitHub Releases for versioned builds; this workflow produces the
# latest build only. CR-DEA-BC-10 retired the central-aggregator Pages
# repository_dispatch path: the aggregator never wired up a consumer workflow
# for `capabilities-updated` and the dispatch secret was unprovisioned, so
# the dispatch step failed on every run.
#
# CR-DEA-BC-10 was originally authored as CR-DEA-BC-08; renumbered to BC-10
# before merge because CR-DEA-BC-08 had already shipped as the Technology
# Management N-006R coordinate (PR #53, 2026-09-08).

on:
  push:
    branches: [main]

concurrency:
  group: publish-latest
  cancel-in-progress: false

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout dea-catalog-business-capabilities
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Generate /latest/ artifacts
        env:
          CI: 'true'
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/publish.js latest

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: capabilities-latest-artifacts
          path: out/latest/
          retention-days: 7
