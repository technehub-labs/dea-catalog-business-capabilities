name: validate-entity-system

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  entity-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run Entity System gate (--strict)
        run: python3 scripts/check_entity_system.py --strict
        continue-on-error: true
      - name: Run Entity System gate (--self-test)
        run: python3 scripts/check_entity_system.py --self-test
